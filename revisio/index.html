<div class="lupa" id="lupa" role="dialog" aria-modal="true" aria-label="Imagen grande" hidden>
  <img id="lupa-img" alt="">
  <button type="button" class="ic" id="lupa-tanca" aria-label="Cerrar la imagen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</div>
<div class="avis" id="avis" role="status" aria-live="polite"></div>
<p class="amagat" id="anunci" aria-live="polite"></p>
<script>
(() => {
  "use strict";
  const API = "https://api.klonk.fit/v1", CAT = "/revisio/cataleg.json", SES = "klonk.revisio.sessio", PEND = "klonk.revisio.pendents";
  const QUE = { "il-cua": "Dibujo de ella", "il-tirants": "Dibujo de él", nom: "Nombre", sinonims: "Sinónimos", musculs: "Músculos", variacions: "Variantes", altre: "Otra cosa" };
  const QUE_EN = { "il-cua": " en el dibujo de ella", "il-tirants": " en el dibujo de él", nom: " en el nombre", sinonims: " en los sinónimos", musculs: " en los músculos", variacions: " en la familia o las variantes", altre: "" };
  const TIPUS = { c: "Multiarticular", a: "Monoarticular" };
  const CARREGA = { placas: "Placas", mancuernas: "Mancuernas", barra: "Barra", lastre: "Lastre", multipower: "Multipower", discos: "Discos" };
  const NOM_E = { bo: "Bien", ko: "Por cambiar", rs: "Resuelto", mig: "A medias" };
  const ESPERES = [5, 15, 30, 60, 120];
  const MAX_IMG = 3, MAX_DATAURL = 1900000;
  const I_B = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const I_F = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
  const I_E = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const I_D = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const I_T = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6m5-6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const $ = id => document.getElementById(id);
  const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const norm = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const llegeix = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const desa = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const treu = k => { try { localStorage.removeItem(k); } catch (e) {} };
  const clauDe = s => s && s.id && s.token ? "Bearer " + s.id + "." + s.token : null;
  const dd = n => String(n).padStart(2, "0");
  const data = s => { const d = new Date(s * 1000); return dd(d.getDate()) + "-" + dd(d.getMonth() + 1) + "-" + d.getFullYear() + " " + dd(d.getHours()) + ":" + dd(d.getMinutes()); };
  const AMPLE = matchMedia("(min-width: 1000px)");
  const llista = a => Array.isArray(a) ? a : [];

  let EX = [], PER = new Map(), FAMS = new Map(), REV = [], PER_EX = new Map(), ORFES = [], TOT_ORDRE = [];
  let clau = null, jo = null, potEscriure = false, darrera = 0;
  let filtre = "tots", q = "", grup = "", dib = "";
  let actual = null, ordre = [], visibles = new Set(), form = null, origenLupa = null, pintat = null;
  const ESB = new Map();

  const estat = (t, mal) => { const e = $("estat"); e.hidden = !t; e.innerHTML = t || ""; e.className = "estat" + (mal ? " mal" : ""); };
  let tAvis = 0;
  function avis(t, mal) { const a = $("avis"); a.textContent = t; a.className = "avis vis" + (mal ? " mal" : ""); clearTimeout(tAvis); tAvis = setTimeout(() => { a.className = "avis" + (mal ? " mal" : ""); }, mal ? 4200 : 2200); }
  function anuncia(t) { const a = $("anunci"); a.textContent = ""; setTimeout(() => { a.textContent = t; }, 40); }

  const llegeixPend = () => llista(llegeix(PEND)).filter(p => p && p.tmp && p.cos);
  function indexa() {
    PER_EX = new Map();
    const tots = REV.concat(llegeixPend().map(p => Object.assign({}, p.cos, { id: p.tmp, nick: jo, quan: p.quan, resolt: null, imatges: [], pendent: true })));
    tots.sort((a, b) => (a.quan || 0) - (b.quan || 0));
    for (const r of tots) { if (!r || !r.ex || !QUE[r.que]) continue; if (!PER_EX.has(r.ex)) PER_EX.set(r.ex, []); PER_EX.get(r.ex).push(r); }
    ORFES = [...PER_EX.keys()].filter(id => !PER.has(id)).sort();
  }
  function unitats(id) { const u = {}; for (const r of PER_EX.get(id) || []) u[r.que] = r; return u; }
  const eDe = r => !r ? "" : r.estat === "bo" ? "bo" : r.resolt ? "rs" : "ko";
  function parts(e) {
    const p = [];
    if (e.il && e.il.cua) p.push("il-cua");
    if (e.il && e.il.tirants) p.push("il-tirants");
    return p.concat(["nom", "sinonims", "musculs", "variacions"]);
  }
  function complet(id) { const e = PER.get(id), u = unitats(id); return !!e && parts(e).every(p => u[p]); }
  function estatEx(id) {
    const u = unitats(id), e = PER.get(id);
    let ko = false, rs = false;
    for (const k in u) { const s = eDe(u[k]); if (s === "ko") ko = true; else if (s === "rs") rs = true; }
    if (ko) return "ko";
    if (rs) return "rs";
    if (!e) return Object.keys(u).length ? "bo" : "";
    const ps = parts(e), fetes = ps.filter(p => u[p]).length;
    return fetes === ps.length ? "bo" : (fetes || u.altre) ? "mig" : "";
  }
  const xipDe = r => { const e = eDe(r); return e ? '<span class="xip ' + e + '">' + NOM_E[e] + '</span>' + (r.pendent ? '<span class="xip pe">Sin enviar</span>' : "") : ""; };
  const xipEsb = que => actual && ESB.has(actual + "|" + que) && !(form && form.que === que) ? '<span class="xip pe">Borrador</span>' : "";

  const pou = (e, a) => e.il && e.il[a]
    ? '<span class="pou" data-a="' + a + '"><img src="/' + esc(e.il[a]) + '" alt="" width="128" height="128" loading="lazy" decoding="async"></span>'
    : '<span class="pou buit" data-a="' + a + '"></span>';
  const tile = e => '<button type="button" class="ex" id="x-' + esc(e.id) + '" data-id="' + esc(e.id) + '"><span class="parella">' + pou(e, "cua") + pou(e, "tirants") + '</span><span class="nom">' + esc(e.es) + '</span><span class="xip" hidden></span></button>';

  function pintaFull() {
    let k = 0, h = "";
    for (const [f, ids] of FAMS) {
      h += '<section class="fam" id="f-' + k + '"><h2 class="fam-t"><span>' + esc(f || "Sin familia") + '</span><span class="fam-n" data-n></span></h2><div class="graella">' + ids.map(id => tile(PER.get(id))).join("") + '</div></section>';
      k++;
    }
    h += '<section class="fam" id="f-orfes" hidden><h2 class="fam-t"><span>Ya no están en el catálogo</span><span class="fam-n" data-n></span></h2><div class="graella" id="g-orfes"></div></section>';
    $("full").insertAdjacentHTML("beforeend", h);
  }
  function pintaOrfes() {
    const s = $("f-orfes"); if (!s) return;
    s.hidden = !ORFES.length;
    s.querySelector("[data-n]").textContent = ORFES.length ? String(ORFES.length) : "";
    $("g-orfes").innerHTML = ORFES.map(id => { const st = estatEx(id); return '<button type="button" class="ex orfe" id="x-' + esc(id) + '" data-id="' + esc(id) + '"' + (id === actual ? ' aria-current="true"' : "") + '><span class="parella"></span><span class="nom">' + esc(id) + '</span>' + (st ? '<span class="xip ' + st + '">' + NOM_E[st] + '</span>' : "") + '</button>'; }).join("");
  }
  function pintaTile(id) {
    const t = $("x-" + id); if (!t || !PER.has(id)) return;
    const u = unitats(id);
    t.querySelectorAll(".pou").forEach(p => { const e = eDe(u["il-" + p.dataset.a]); if (e) p.dataset.e = e; else delete p.dataset.e; });
    const s = estatEx(id), x = t.querySelector(".xip");
    x.hidden = !s; x.className = "xip " + s; x.textContent = NOM_E[s] || "";
    t.setAttribute("aria-label", PER.get(id).es + (s ? ", " + NOM_E[s].toLowerCase() : ""));
  }
  function resum() {
    let rev = 0, ko = 0, rs = 0, bo = 0;
    for (const e of EX) { const s = estatEx(e.id); if (complet(e.id)) rev++; if (s === "ko") ko++; else if (s === "rs") rs++; else if (s === "bo") bo++; }
    const n = EX.length || 1, pe = llegeixPend().length;
    $("n-rev").textContent = rev; $("n-tots").textContent = EX.length; $("n-ko").textContent = ko; $("n-rs").textContent = rs;
    $("t-rs").textContent = rs === 1 ? "resuelto" : "resueltos";
    $("pe").hidden = !pe; $("n-pe").textContent = pe;
    $("b-bo").style.width = (bo / n * 100) + "%";
    $("b-rs").style.left = (bo / n * 100) + "%"; $("b-rs").style.width = (rs / n * 100) + "%";
    $("b-ko").style.left = ((bo + rs) / n * 100) + "%"; $("b-ko").style.width = (ko / n * 100) + "%";
  }
  function filtra() {
    if (!EX.length) return;
    const paraules = norm(q).trim().split(/\s+/).filter(Boolean);
    ordre = []; visibles = new Set();
    let k = 0;
    for (const [, ids] of FAMS) {
      let vis = 0;
      for (const id of ids) {
        const e = PER.get(id), s = estatEx(id), t = $("x-" + id);
        const nDib = (e.il && e.il.cua ? 1 : 0) + (e.il && e.il.tirants ? 1 : 0);
        const passa = (filtre === "tots" || (filtre === "sense" && !complet(id)) || (filtre === s))
          && (!grup || (grup === "-" ? !e.grup : e.grup === grup))
          && (!dib || (dib === "2" && nDib === 2) || (dib === "1" && nDib < 2) || (dib === "0" && nDib === 0))
          && paraules.every(p => e._q.includes(p));
        t.hidden = !passa;
        if (passa) { vis++; ordre.push(id); visibles.add(id); }
      }
      const sec = $("f-" + k);
      sec.hidden = !vis;
      sec.querySelector("[data-n]").textContent = vis === ids.length ? String(ids.length) : vis + " de " + ids.length;
      k++;
    }
    const tot = ordre.length === EX.length;
    $("n-vis").textContent = tot ? "" : ordre.length === 1 ? "1 ejercicio" : ordre.length + " ejercicios";
    $("buit").hidden = !!ordre.length;
    navega();
  }
  function veiDe(dir) {
    if (!actual || !ordre.length) return null;
    const i = ordre.indexOf(actual);
    if (i >= 0) return ordre[i + dir] || null;
    for (let j = TOT_ORDRE.indexOf(actual) + dir; j >= 0 && j < TOT_ORDRE.length; j += dir) if (visibles.has(TOT_ORDRE[j])) return TOT_ORDRE[j];
    return null;
  }
  function posicio() {
    if (!PER.has(actual)) return "";
    const i = ordre.indexOf(actual);
    return i < 0 ? "Fuera del filtro" : (i + 1) + " de " + ordre.length;
  }
  function navega() {
    const fx = $("fitxa"); if (!actual) return;
    const p = fx.querySelector(".fx-pos"); if (p) p.textContent = posicio();
    const a = fx.querySelector('[data-nav="-1"]'), s = fx.querySelector('[data-nav="1"]');
    if (a) a.disabled = !veiDe(-1);
    if (s) s.disabled = !veiDe(1);
  }
  function repintaTot() { if (!EX.length) return; indexa(); for (const e of EX) pintaTile(e.id); pintaOrfes(); resum(); filtra(); if (actual) pintaFitxa(); }
  function refresca(id) { if (!EX.length) return; indexa(); pintaTile(id); pintaOrfes(); resum(); filtra(); if (id === actual) pintaFitxa(); }

  const botons = (que, r, senseBo) => {
    const e = eDe(r), dis = potEscriure ? "" : " disabled", nom = QUE[que].toLowerCase();
    return '<span class="bts">' + (senseBo ? "" : '<button type="button" class="bt b' + (e === "bo" ? " on" : "") + '" data-bo="' + que + '" aria-label="Bien: ' + nom + '"' + dis + '>' + I_B + 'Bien</button>')
      + '<button type="button" class="bt f' + (e === "ko" ? " on" : "") + '" data-ko="' + que + '" aria-expanded="' + (!!form && form.que === que) + '" aria-label="Cambiar: ' + nom + '"' + dis + '>' + I_F + 'Cambiar</button></span>';
  };
  function dibuix(e, a, u) {
    const que = "il-" + a, gran = (e.il_gran && e.il_gran[a]) || (e.il && e.il[a]), qui = a === "cua" ? "ella" : "él", st = eDe(u[que]);
    const img = gran
      ? '<button type="button" class="dib-img' + (st ? " e-" + st : "") + '" data-lupa="/' + esc(gran) + '" aria-label="Ver grande el dibujo de ' + qui + '"><img src="/' + esc(gran) + '" alt="' + esc(e.es) + ', ' + qui + '" width="906" height="644" decoding="async"></button>'
      : '<div class="dib-img buit"><span>Sin dibujo</span></div>';
    return '<figure class="dib">' + img + '<figcaption class="dib-peu"><span class="dib-nom">' + (a === "cua" ? "Ella" : "Él") + '</span>' + xipDe(u[que]) + xipEsb(que) + '</figcaption>' + botons(que, u[que], !gran) + '</figure>';
  }
  const fila = (dt, dd, falta) => '<div><dt>' + dt + '</dt><dd' + (falta ? ' class="falta"' : "") + '>' + dd + '</dd></div>';
  const fx = rows => '<dl class="fx">' + rows.join("") + '</dl>';
  function bloc(que, titol, u, cos) {
    return '<section class="bloc"><div class="bloc-cap"><h3>' + titol + xipDe(u[que]) + xipEsb(que) + '</h3>' + botons(que, u[que]) + '</div>' + cos + '<div data-form="' + que + '"></div></section>';
  }
  function historial(id) {
    const rs = (PER_EX.get(id) || []).slice().reverse();
    if (!rs.length) return '<p class="res">Todavía no hay revisiones.</p>';
    return '<ol class="rvs">' + rs.map(r => '<li class="rv"><div class="rv-cap"><span class="rv-que">' + esc(QUE[r.que] || r.que) + '</span>' + xipDe(r)
      + '<span class="rv-qui">' + (r.pendent ? "" : esc(r.nick || "") + (r.quan ? ", " + data(r.quan) : "")) + '</span></div>'
      + (r.nota ? '<p class="rv-nota">' + esc(r.nota) + '</p>' : "")
      + (llista(r.imatges).length ? '<div class="rv-imgs">' + llista(r.imatges).map((iid, k) => '<button type="button" class="rv-img" data-iid="' + esc(iid) + '" aria-label="Ver la imagen ' + (k + 1) + '"><img alt="" data-iid="' + esc(iid) + '"></button>').join("") + '</div>' : "")
      + (r.resolt ? '<p class="rv-fet">Resuelto el ' + data(r.resolt) + (r.resolt_nota ? ": " + esc(r.resolt_nota) : "") + '</p>' : "")
      + '</li>').join("") + '</ol>';
  }
  function selDe(el) {
    for (const a of ["data-bo", "data-ko", "data-nav", "data-lupa"]) if (el.hasAttribute(a)) return "[" + a + '="' + CSS.escape(el.getAttribute(a)) + '"]';
    if (el.classList.contains("chip") && el.dataset.id) return '.chip[data-id="' + CSS.escape(el.dataset.id) + '"]';
    if (el.id) return "#" + CSS.escape(el.id);
    return null;
  }
  function pintaFitxa() {
    const fxEl = $("fitxa"), e = PER.get(actual), orfe = !e && PER_EX.has(actual);
    if (!e && !orfe) return;
    const mateix = pintat === actual; pintat = actual;
    const f = $("nova"), focus = document.activeElement && document.activeElement.id, sel = f && $("nova-nota") ? [$("nova-nota").selectionStart, $("nova-nota").selectionEnd] : null;
    const ae = document.activeElement, dins = mateix && ae && fxEl.contains(ae) && !(f && f.contains(ae)) ? selDe(ae) : null;
    if (f) f.remove();
    const cap = '<div class="fx-cap"><button type="button" class="ic tanca" id="tanca" aria-label="Volver a la lista">' + I_T + '</button>'
      + '<h2 class="fx-t" id="fx-t" tabindex="-1">' + esc(e ? e.es : actual) + '</h2>'
      + '<div class="fx-nav"><button type="button" class="ic" data-nav="-1" aria-label="Ejercicio anterior">' + I_E + '</button><button type="button" class="ic" data-nav="1" aria-label="Ejercicio siguiente">' + I_D + '</button></div>';
    if (orfe) {
      fxEl.innerHTML = cap + '<div class="fx-sub"></div></div><p class="nota-orfe">Este ejercicio ya no está en el catálogo con este nombre. Aquí quedan sus revisiones.</p>'
        + '<section class="hist" aria-label="Revisiones"><h3>Revisiones</h3>' + historial(actual) + '</section>';
    } else {
      const u = unitats(actual);
      const tags = (e.amagat ? '<span class="tag">Oculto en el buscador</span>' : "") + (e.casa ? '<span class="tag">De las rutinas de KLONK</span>' : "");
      const germans = e.familia ? (FAMS.get(e.familia) || []) : [];
      const variants = germans.length > 1
        ? '<div class="chips">' + germans.map(id => { const g = PER.get(id); return '<button type="button" class="chip" data-id="' + esc(id) + '"' + (id === actual ? ' aria-current="true"' : "") + '>' + esc(g.etiqueta || g.es) + '</button>'; }).join("") + '</div>'
        : "";
      const m = e.musculs || {}, mp = llista(m.p).filter(Boolean), ms = llista(m.s).filter(Boolean), sin = llista(e.sinonims).filter(Boolean);
      fxEl.innerHTML = cap + '<div class="fx-sub"><span class="fx-pos"></span>' + tags + '</div></div>'
        + '<div class="dibs">' + dibuix(e, "cua", u) + dibuix(e, "tirants", u) + '</div><div data-form="il-cua"></div><div data-form="il-tirants"></div>'
        + bloc("nom", "Nombre", u, fx([fila("Castellano", esc(e.es)), fila("Inglés", e.en ? esc(e.en) : "Falta", !e.en), fila("Catalán", e.ca ? esc(e.ca) : "Falta", !e.ca)]))
        + bloc("sinonims", "Sinónimos", u, fx([fila(sin.length === 1 ? "Sinónimo" : "Sinónimos", sin.length ? sin.map(esc).join("<br>") : "Ninguno", !sin.length)]))
        + bloc("musculs", "Músculos", u, fx([fila("Principales", mp.length ? mp.map(esc).join(", ") : "Ninguno", !mp.length), fila("Secundarios", ms.length ? ms.map(esc).join(", ") : "Ninguno", !ms.length)]))
        + bloc("variacions", "Familia y variantes", u, fx([fila("Familia", e.familia ? esc(e.familia) : "Sin familia", !e.familia), fila("Variante", e.etiqueta ? esc(e.etiqueta) : "Sin variante", !e.etiqueta)]) + variants)
        + '<section class="bloc"><div class="bloc-cap"><h3>Ficha</h3></div>' + fx([
            fila("Grupo", e.grup ? esc(e.grup) : "Sin grupo", !e.grup), fila("Tipo", e.tipus ? esc(TIPUS[e.tipus] || e.tipus) : "Sin tipo", !e.tipus),
            fila("Material", e.material ? esc(e.material) : "Sin material", !e.material), fila("Carga", e.carrega ? esc(CARREGA[e.carrega] || e.carrega) : "Sin carga", !e.carrega)]) + '</section>'
        + '<section class="bloc"><div class="bloc-cap"><h3>Otra cosa' + xipDe(u.altre) + xipEsb("altre") + '</h3>' + botons("altre", u.altre, !u.altre) + '</div><div data-form="altre"></div></section>'
        + '<section class="hist" aria-label="Revisiones"><h3>Revisiones</h3>' + historial(actual) + '</section>';
    }
    if (f && form) {
      const anc = fxEl.querySelector('[data-form="' + form.que + '"]');
      if (anc) { anc.appendChild(f); if (focus && $(focus)) { $(focus).focus({ preventScroll: true }); if (sel && focus === "nova-nota") $("nova-nota").setSelectionRange(sel[0], sel[1]); } }
      else form = null;
    }
    if (dins) { const x = fxEl.querySelector(dins); if (x && !x.disabled) x.focus({ preventScroll: true }); }
    fxEl.querySelectorAll("img[data-iid]").forEach(img => { carregaImg(img.dataset.iid).then(u2 => { img.src = u2; }).catch(() => { img.alt = "No se ha podido cargar"; }); });
    navega();
  }

  function fons(inert) { for (const id of ["cap", "eines", "estat", "full"]) { const el = $(id); if (!el) continue; if (inert) el.setAttribute("inert", ""); else el.removeAttribute("inert"); } }
  function obre(id, o) {
    o = o || {};
    if (!PER.has(id) && !PER_EX.has(id)) return;
    if (form && id !== actual) tancaForm();
    const ant = actual; actual = id;
    if (ant && ant !== id) { const t = $("x-" + ant); if (t) t.removeAttribute("aria-current"); }
    const t = $("x-" + id); if (t) t.setAttribute("aria-current", "true");
    const fxEl = $("fitxa"), jaOberta = !fxEl.hidden;
    pintaFitxa();
    fxEl.hidden = false;
    if (ant !== id) fxEl.scrollTop = 0;
    if (!AMPLE.matches) {
      document.body.classList.add("amb-fitxa"); fons(true);
      try { if (!jaOberta && !o.inici) history.pushState({ fx: id }, "", "#" + id); else history.replaceState(history.state && history.state.fx ? { fx: id } : null, "", "#" + id); } catch (x) {}
    } else {
      try { history.replaceState(null, "", "#" + id); } catch (x) {}
      if (o.scroll && t && !t.hidden) t.scrollIntoView({ block: "nearest" });
    }
    if (o.focus) { const h = $("fx-t"); if (h) h.focus({ preventScroll: true }); }
    if (ant !== id && jaOberta) anuncia((PER.has(id) ? PER.get(id).es : id) + (posicio() ? ", " + posicio() : ""));
  }
