<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fragua"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icono-180.png"><link rel="icon" type="image/png" sizes="192x192" href="icono-192.png"><link rel="manifest" href="manifest.webmanifest"></head><body><title>Fragua</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Noto+Serif:wdth,wght@62.5..100,400..700&display=swap">
<style>
/* FRAGUA, direcció A (26/09/2026). L'Albert: «m'ha agradat molt la versió A... espero que puguis
   clavar-la al pixel». Tot surt de referencies/inici-calma/ref-1.png, amidada: panells de basalt amb
   vora de bronze i les cantonades tallades, una sola llum (la fragua, a l'esquerra, darrere el
   personatge), Cinzel per als rètols en majúscules i Noto Serif per a la resta, i el foc (del vermell
   #fd3601 al groc #fee132) només on hi ha foc: l'XP, les flames, les gràfiques i el botó.
   La referència és de 1024 px d'ample; al mòbil les proporcions es mantenen i la lletra puja un terç,
   perquè a 390 px la de la imatge no es llegiria. */
:root{
  --panell:linear-gradient(180deg,#221e1c 0%,#1b1918 38%,#171514 100%);
  --panell-2:linear-gradient(180deg,#1a1816,#121110);
  --bronze:linear-gradient(160deg,#d8914a 0%,#8b4722 26%,#b76c2f 50%,#6d3414 76%,#a95f29 100%);
  --bronze-fosc:linear-gradient(160deg,#a8622f 0%,#5a2e17 40%,#83461f 70%,#5c2f15 100%);
  --bronze-fil:rgba(197,123,55,.45);
  --crema:#f6e3b8; --fum:#c9b28e; --fum-2:#8f7b66;
  --brasa:#fd3601; --taronja:#ff8a17; --flama:#fee132;
  --verd:#8ee486;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --text:"Noto Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#000;color:var(--crema);font-family:var(--text);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flama);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700}

/* el fons: la fragua de la A, amb l'arc del foc a l'esquerra; fosqueja cap a la dreta i cap avall */
.fons{position:fixed;inset:0;z-index:0;background:#000 url("assets/fons.webp") 22% top/cover no-repeat}
.fons::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.38) 100%),
  linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.2) 40%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.82) 100%)}
.ambient{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:env(safe-area-inset-top,0px) 12px calc(26px + env(safe-area-inset-bottom,0px));overflow-x:clip}
/* sense zoom: ni pessic ni doble toc (el pessic de Safari es talla també per JS, a app.js) */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.chispas{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---- la lletra ---- */
/* el degradat daurat només es pinta dins de la caixa del text: sense aire a dalt, l'accent de «DÍA» o
   d'«ESTADÍSTICAS» en queda fora i no es veu. El padding li fa lloc i el marge negatiu el compensa. */
.or{background:linear-gradient(180deg,#fff4d2 0%,#f8d78d 45%,#e2a04a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding-top:.2em;margin-top:-.2em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.8))}
.rotul{font-family:var(--display);font-weight:800;letter-spacing:.02em}
.suau{color:var(--fum)}
.petit{font-size:14px}
.num{font-variant-numeric:tabular-nums lining-nums}
.ombra{text-shadow:0 2px 2px rgba(0,0,0,.85)}

/* ---- el marc: bronze amb les cantonades tallades (la peça de tota la A) ----
   La vora és el fons de l'element i el farciment, un ::before a dins amb el mateix tall. */
.marc,.panel{--x:10px;--v:2px;--fons:var(--panell);position:relative;isolation:isolate;background:var(--bronze);border:0;
  clip-path:polygon(var(--x) 0,calc(100% - var(--x)) 0,100% var(--x),100% calc(100% - var(--x)),calc(100% - var(--x)) 100%,var(--x) 100%,0 calc(100% - var(--x)),0 var(--x))}
.marc::before,.panel::before{content:"";position:absolute;inset:var(--v);z-index:-1;background:var(--fons);--y:calc(var(--x) - var(--v) * .59);
  clip-path:polygon(var(--y) 0,calc(100% - var(--y)) 0,100% var(--y),100% calc(100% - var(--y)),calc(100% - var(--y)) 100%,var(--y) 100%,0 calc(100% - var(--y)),0 var(--y))}
.panel.pad{padding:14px}
.bloc{position:relative;margin-top:34px}
.pestanya{position:absolute;left:50%;top:0;z-index:3;transform:translate(-50%,-56%);--x:9px;padding:5px 22px 7px;
  font-family:var(--text);font-weight:700;font-size:20px;line-height:1.15;white-space:nowrap;color:var(--crema);text-shadow:0 2px 2px rgba(0,0,0,.85)}
.bloc > .panel{padding-top:26px}

/* ---- botons ---- */
/* el botó gran és la peça de la A mateixa (boto-lava.webp: la vora de bronze i or, la lava amb
   esquerdes), refeta sense lletres pel ChatGPT i amb les seves proporcions; el text va a sobre */
.forja{position:relative;z-index:3;filter:drop-shadow(0 0 9px rgba(255,100,20,.45)) drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.btn-forja{position:relative;display:grid;place-content:center;justify-items:center;gap:1px;width:100%;aspect-ratio:4.05;min-height:72px;padding:4.2% 9% 2.6%;border:0;
  background:url("assets/boto-lava.webp") center/100% 100% no-repeat;color:var(--crema);transition:transform .12s ease,filter .12s ease}
.btn-forja:hover{filter:brightness(1.08)}
.btn-forja:active{transform:scale(.98)}
.btn-forja span{font-family:var(--display);font-weight:900;font-size:clamp(19px,5.9vw,25px);letter-spacing:.02em;line-height:1.2;padding-top:.08em;filter:drop-shadow(0 2px 0 rgba(60,5,0,.95)) drop-shadow(0 0 6px rgba(80,10,0,.6))}
.btn-forja small{font-family:var(--text);font-weight:700;font-size:clamp(12.5px,3.7vw,15px);line-height:1.2;color:#fde8c0;margin-top:0;text-shadow:0 2px 2px rgba(60,5,0,.95)}
.btn-forja:disabled{filter:grayscale(.6) brightness(.7)}
.btn{--x:7px;--v:1.5px;--fons:var(--panell);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;
  color:var(--crema);font-family:var(--text);font-weight:700;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.clar{--bronze:linear-gradient(180deg,#ffc978,#d06a24 50%,#ffae55);--fons:linear-gradient(180deg,#b3200a,#7c0e03);color:#fff0cf}
.enllac{background:none;border:0;color:#e6a45a;text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:15px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bronze-fil);background:rgba(20,17,15,.92);color:var(--crema);font-size:14.5px;font-weight:700}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#b3200a,#7c0e03);border-color:#f0a050;color:#fff0cf}
.fila{display:flex;align-items:center;gap:10px}
.fila.entre{justify-content:space-between}
.envolta{flex-wrap:wrap}

/* ---- l'entrada: logo, personatge i placa ---- */
.boto-musica{--x:7px;--v:1.5px;position:absolute;right:4px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;width:40px;height:40px;display:grid;place-items:center;color:var(--flama)}
.sessio-cap .boto-musica{top:8px;right:8px}
.boto-musica[aria-pressed="false"]{color:var(--fum-2)}
/* passar cançó: petit, just a sota del de la música */
.boto-seg{--x:6px;--v:1.5px;position:absolute;right:9px;top:calc(54px + env(safe-area-inset-top,0px));z-index:5;width:30px;height:30px;display:grid;place-items:center;color:var(--flama)}
.boto-seg[hidden]{display:none}
.sessio-cap .boto-seg{top:54px;right:13px}
/* ---- la càrrega: la progressió i l'esquema dels discos (26/09) ---- */
.grup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prog{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:3px 10px;border-radius:999px;border:1px solid var(--bronze-fil);background:rgba(20,17,15,.9);color:var(--crema);font:700 12.5px/1 var(--text);font-variant-numeric:tabular-nums}
.prog.sube{color:#ffd27a;border-color:#e0892c;background:linear-gradient(180deg,rgba(150,40,8,.6),rgba(70,20,6,.6));box-shadow:0 0 10px rgba(255,120,30,.25)}
.prog.reps{color:#ffcf8a}
.prog.baja{color:#bfe3ff;border-color:#4d7fa6}
.prog.nova{color:var(--fum)}
.carga-lloc:empty{display:none}
.carga{margin:12px 0 4px}
.carga-vis{position:relative;height:112px;overflow:hidden}
.carga-barra{position:absolute;left:-4%;top:47px;width:108%;height:34px;transform:translateY(-50%);mix-blend-mode:screen;pointer-events:none}
.carga-discos{position:absolute;left:25.5%;top:0;height:94px;display:flex;align-items:center;gap:0}
.dl{position:relative;display:grid;place-items:center;min-width:27px;height:94px}
.dl img{height:calc(92px * var(--m));width:auto;filter:drop-shadow(2px 0 3px rgba(0,0,0,.7))}
.dl b{position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);font:900 11px/1 var(--display);color:#ffe2a8;white-space:nowrap}
.carga-peu{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px;color:var(--fum);margin-top:2px}
.carga-on{font-weight:700;color:#ffb55e;font-size:12.5px}
.carga-aprox{color:#ffcf8a}
.carga.buida,.carga.lastre{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.carga-cares{display:flex;align-items:center;gap:6px}
.dc{position:relative;display:grid;place-items:center;width:calc(30px + 34px * var(--m));aspect-ratio:1}
.dc img{width:100%;height:100%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.dc b{position:absolute;inset:0;display:grid;place-items:center;font:900 calc(12px + 5px * var(--m))/1 var(--display);color:#fff3d6;text-shadow:0 0 3px #000,0 1px 2px #000,0 0 8px rgba(0,0,0,.9)}
.cargues{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.cargues legend{font-weight:700;margin-bottom:8px;padding:0}
.chip-r{position:relative}
.chip-r input{position:absolute;opacity:0;pointer-events:none}
.chip-r span{display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--bronze-fil);background:rgba(20,17,15,.92);color:var(--crema);font-size:14px;font-weight:700}
.chip-r input:checked+span{background:linear-gradient(180deg,#b3200a,#7c0e03);border-color:#f0a050;color:#fff0cf}
.chip-r input:focus-visible+span{outline:2px solid #ffb030;outline-offset:2px}
/* ---- Ajustes per seccions (26/09) ---- */
.ajustes{display:grid;gap:10px}
.aj{--x:8px;--v:1.5px}
.aj-cap{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:1fr auto 18px;align-items:center;gap:10px;min-height:56px;padding:12px 14px;background:none;border:0;color:var(--crema);text-align:left}
.aj-t{font-weight:700;font-size:16.5px}
.aj-r{color:var(--fum);font-size:13px;text-align:right}
.aj-cap svg{width:18px;height:18px;transition:transform .2s}
.aj.oberta .aj-cap svg{transform:rotate(180deg)}
.aj-cos{position:relative;z-index:1;padding:0 14px 16px}
.aj-fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(197,123,55,.15)}
.aj-fila>span:first-child{display:grid;gap:3px;font-weight:700;font-size:15px}
.aj-fila small{font-weight:400;color:var(--fum);font-size:12.5px;line-height:1.35}
.aj-sub{font-size:14.5px;margin:16px 0 8px;color:#ffb55e}
.camp.curt{width:96px;flex:none}
.camp.curt input{height:44px}
.aj-fila select{max-width:130px}
.pas{display:inline-flex;align-items:center;gap:6px;flex:none}
.pas button{width:38px;height:38px;border-radius:8px;border:1px solid var(--bronze-fil);background:#15110f;color:var(--crema);font-size:20px;line-height:1}
.pas b{min-width:62px;text-align:center;font-family:var(--display);font-size:16px;color:#ffd27a}
.aj-discos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 4px;align-items:center;justify-items:center}
.aj-disc{background:none;border:0;padding:2px;display:grid;place-items:center;min-height:62px;border-radius:50%}
.aj-disc .dc{width:calc(60px * var(--m))}
.aj-disc[aria-pressed="false"] .dc img{filter:grayscale(.95) brightness(.4)}
.aj-disc[aria-pressed="false"] .dc b{color:var(--fum-2)}
.font{font-size:12.5px;color:var(--fum);line-height:1.5;margin:12px 0 0}
.aj-avis{margin:20px 6px 8px;font-size:13px;color:var(--fum);line-height:1.55;text-align:center}
.banda-demo{--x:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin:10px 0 14px;font-size:14px;position:relative;z-index:2}
.banda-demo .btn{min-height:40px;padding:0 12px;font-size:14px}
/* ---- el cos (26/09) ---- */
.mesures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mesura{--x:8px;display:grid;gap:3px;justify-items:start;padding:12px 12px 10px;text-align:left;color:var(--crema)}
.mesura>*{position:relative;z-index:1}
.mesura.sel{background:linear-gradient(180deg,#ffd27a,#d9731f);--fons:linear-gradient(180deg,#2e1c12,#1a1412)}
.m-nom{font-size:13.5px;color:var(--fum);font-weight:700}
.m-val{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.05;min-height:27px}
.m-val small{font-size:13px;color:var(--fum);font-family:var(--text);font-weight:700}
.m-dif{font-size:12px;color:var(--fum)}
.spark{margin-top:2px}
.comp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.comp span{display:block;font-family:var(--display);font-weight:900;font-size:22px}
.comp small{font-size:11.5px;color:var(--fum);line-height:1.3;display:block}
.cos-buit{display:grid;justify-items:center;text-align:center;gap:8px;margin-bottom:12px}
.cos-buit img{border-radius:12px}
.camp-mesura{display:grid;grid-template-columns:64px minmax(0,1fr) 96px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(197,123,55,.15)}
.camp-mesura:not(:has(img)){grid-template-columns:minmax(0,1fr) 96px}
.camp-mesura img{width:64px;height:64px;border-radius:8px;object-fit:cover}
.cm-t{display:grid;gap:2px;font-weight:700}
.cm-t small{font-weight:400;font-size:12px;color:var(--fum);line-height:1.3}
.cm-grup{font-size:14.5px;color:#ffb55e;margin:14px 0 2px}
/* ---- l'or i la botiga ---- */
/* el comptador d'or, dret: la moneda a dalt i el número a sota, perquè càpiga al racó sense tocar el logo */
.boto-or{--x:7px;--v:1.5px;position:absolute;left:4px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:grid;justify-items:center;gap:1px;min-width:44px;padding:5px 4px 4px;
  color:#ffe6a6;font-family:var(--display);font-weight:900;font-size:12.5px;line-height:1}
.boto-or svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 0 4px rgba(255,190,60,.55))}
.saldo{display:flex;justify-content:space-between;align-items:center}
.saldo-n{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:28px}
.saldo-n svg{width:30px;height:30px}
.tabs-t{display:flex;gap:8px;justify-content:center;margin:14px 0 14px}
.botiga{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.carta{--x:10px;display:grid;justify-items:center;gap:4px;padding:12px 8px 12px;color:var(--crema);text-align:center}
.carta img{height:150px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.carta.bloq img,.carta-gran.bloq img,.carrusel img.bloq{filter:brightness(0) drop-shadow(0 0 4px rgba(255,120,30,.9)) drop-shadow(0 0 10px rgba(255,90,20,.35))}
.carta-nom{font-weight:700;font-size:15px;line-height:1.2}
.carta-estat{font-size:13px;color:var(--verd);font-weight:700}
.preu{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:900;font-size:16px;color:#ffd780}
.preu svg{width:17px;height:17px}
.preu-c{position:absolute;left:50%;bottom:14px;z-index:3;transform:translateX(-50%);padding:4px 12px;border-radius:999px;background:rgba(10,8,7,.85);border:1px solid #f0a050;font-size:18px}
.carta-gran{display:flex;justify-content:center;height:300px}
.carta-gran img{display:block;height:300px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.7))}
.carta-gran.revela img{animation:revela 1.2s ease-out}
@keyframes revela{0%{filter:brightness(0) drop-shadow(0 0 5px #ff7a1a)}35%{filter:brightness(2.4) drop-shadow(0 0 26px #ffb040)}100%{filter:brightness(1) drop-shadow(0 10px 16px rgba(0,0,0,.7))}}
.lema-c{text-align:center;color:var(--fum);margin:10px 0 6px}
.falta{text-align:center;color:#ffb070;font-weight:700;margin:10px 0}
.paquet{--x:10px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin-bottom:10px}
.paquet > svg{width:40px;height:40px}
.paquet .n{font-family:var(--display);font-weight:900;font-size:20px}
.paquet .preu-e{font-weight:700;font-size:17px}
.paquet .aviat{font-size:12.5px;color:var(--fum-2)}
.oro-guanyat{display:flex;justify-content:center;align-items:center;gap:8px;margin:4px 0 10px;font-size:18px;font-weight:700;color:var(--fum)}
.oro-guanyat svg{width:30px;height:30px}
.oro-guanyat b{font-family:var(--display);font-weight:900;font-size:28px}
.flota.oro{color:#ffd24a;font-size:18px}
.personatge.aura .brillo{background:radial-gradient(ellipse at 50% 62%,rgba(255,150,40,.55),rgba(255,90,20,.18) 45%,transparent 70%);animation:aura 2.6s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.75}50%{opacity:1}}
.sessio-cap{margin-top:4px}
.logo{position:relative;z-index:1;display:block;width:72%;max-width:330px;margin:10px auto 0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.heroe{position:relative;display:grid;grid-template-columns:48% 1fr;gap:4px;align-items:start;margin-top:-30px}
.heroe .personatge{z-index:2;height:266px;margin-bottom:-46px}
.personatge{position:relative;height:300px}
.personatge .brillo{position:absolute;left:50%;bottom:12%;width:120%;height:70%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 70%,rgba(255,120,30,.28),rgba(255,90,20,.06) 45%,transparent 70%);pointer-events:none}
.personatge img{position:absolute;left:50%;bottom:0;height:100%;width:auto;max-width:125%;transform:translateX(-50%);transform-origin:50% 100%;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.7));animation:respira 3.6s ease-in-out infinite}
.personatge canvas{position:absolute;inset:-10px -20px 0;width:calc(100% + 40px);height:calc(100% + 10px);pointer-events:none}
.personatge.amb3d img{display:none}
.personatge img.foto3d{top:-10px;left:-20px;bottom:auto;width:calc(100% + 40px);height:calc(100% + 10px);max-width:none;object-fit:contain;transform:none;animation:none;filter:none}
.personatge.salta img{animation:salta .6s ease-out}
@keyframes respira{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.012,1.018)}}
@keyframes salta{0%{transform:translateX(-50%) translateY(0)}35%{transform:translateX(-50%) translateY(-14px) scale(1.03)}100%{transform:translateX(-50%) translateY(0)}}

.placa{margin-top:36px;--x:10px;display:grid}
.placa-nom{padding:9px 8px 7px;text-align:center;font-family:var(--display);font-weight:800;font-size:25px;line-height:1.1;word-break:break-word;
  background:linear-gradient(180deg,rgba(255,230,190,.05),rgba(255,230,190,0))}
.placa-nom span{display:inline-block}
.placa-nom.llarg{font-size:20px}.placa-nom.molt-llarg{font-size:17px}
.linia{position:relative;height:2px;margin:0 2px;background:var(--bronze)}
.linia::before,.linia::after{content:"";position:absolute;top:50%;width:7px;height:7px;background:#c27a38;transform:translateY(-50%) rotate(45deg)}
.linia::before{left:-3px}.linia::after{right:-3px}
.placa-nivell{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;padding:10px 10px 9px}
.hexagon{position:relative;display:grid;place-items:center;width:42px;height:48px;background:var(--bronze);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hexagon::before{content:"";position:absolute;inset:2.5px;background:radial-gradient(circle at 50% 35%,#302925,#141110 75%);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hexagon span{position:relative;display:flex;align-items:baseline;gap:1px;font-family:var(--display);font-weight:800;line-height:1}
.hexagon small{font-size:10.5px}.hexagon b{font-size:23px}
.hexagon.dos-xifres small{font-size:9px}.hexagon.dos-xifres b{font-size:18px;letter-spacing:-.03em}
.barra{height:12px;border-radius:6px;background:#141312;box-shadow:0 0 0 1.5px #8e4c24,0 0 0 2.5px #2a150a,inset 0 2px 3px rgba(0,0,0,.8);overflow:hidden}
.barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#fd3601 0%,#ff7a12 45%,#ffb526 75%,#fee132 100%);
  box-shadow:0 0 10px rgba(255,120,20,.75);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xp{font-size:14px;font-weight:700;text-align:right;margin-top:5px;color:var(--crema);text-shadow:0 2px 2px rgba(0,0,0,.85)}
.placa-foc{display:grid;grid-template-columns:44px 1fr;gap:9px;align-items:center;padding:10px 9px 11px 10px}
.emblema{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 50% 64%,#962609 0%,#420e05 56%,#1c0805 100%);
  box-shadow:0 0 0 2px #b8702f,0 0 0 3.5px #2a1409,0 0 0 4.5px #7a3f1b,inset 0 0 10px rgba(0,0,0,.75)}
.emblema::before,.emblema::after{content:"";position:absolute;left:50%;width:9px;height:9px;background:#b8702f;transform:translateX(-50%) rotate(45deg);z-index:-1}
.emblema::before{top:-7px}.emblema::after{bottom:-7px}
.emblema svg{width:28px;height:34px;filter:drop-shadow(0 0 5px rgba(255,120,20,.7))}
.emblema b{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:var(--display);font-weight:900;font-size:13px;color:#fff6da;
  text-shadow:0 1px 2px #5a1200,0 0 5px rgba(0,0,0,.9)}
.foc-t{font-size:12.5px;font-weight:700;line-height:1.2;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.foc-n{font-size:18px;font-weight:700;line-height:1.25;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.flames{display:flex;gap:1px;margin-top:4px}
.flames svg{width:15px;height:19px;flex:none}
.flames .encesa{filter:drop-shadow(0 0 4px rgba(255,110,20,.8))}

/* ---- «Cómo vas» ---- */
.com-vas{position:relative;z-index:3;margin-top:30px}
.com-vas > .panel{--x:12px;padding:24px 8px 9px}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.mini{--x:8px;--v:1.5px;--bronze:var(--bronze-fosc);--fons:var(--panell-2);display:flex;flex-direction:column;min-height:130px;padding:8px 5px 7px;text-align:center}
.mini h3{font-size:12.5px;font-stretch:82%;line-height:1.2;white-space:nowrap;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.mini svg{display:block;width:100%;height:74px;margin-top:4px;flex:1 1 auto}
.mini .dada{font-size:12.5px;font-weight:700;margin-top:3px;color:var(--fum)}
.mini .dada.puja{color:var(--verd)}
.mini .buit{margin:auto 2px;font-size:11.5px;line-height:1.3;color:var(--fum-2)}
.fantasma{position:relative;flex:1 1 auto;display:flex;flex-direction:column}
.fantasma .pista{position:absolute;inset:0;display:grid;place-items:center;padding:0 3px;font-size:11.5px;font-weight:700;font-stretch:88%;line-height:1.25;color:var(--fum);
  text-shadow:0 1px 3px #000,0 0 10px #000,0 0 10px #000}
.mini .gran{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin-top:auto}

.inici-forja{width:84%;margin:16px auto 0}
.eines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:92%;margin:14px auto 0}
.eina{--x:9px;--fons:linear-gradient(180deg,#221e1b,#161413);display:grid;justify-items:center;align-content:center;gap:3px;min-height:76px;padding:8px 4px;
  color:var(--crema);font-weight:700;font-size:14.5px;text-shadow:0 2px 2px rgba(0,0,0,.85);transition:transform .12s ease}
.eina:active{transform:scale(.96)}
.eina img{width:46px;height:46px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}

/* ---- capçalera de les altres pantalles ---- */
.cap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 6px}
.enrere{--x:7px;--v:1.5px;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 8px;color:var(--crema);font-weight:700;font-size:15px}
.enrere svg{width:20px;height:20px}
.cap img{height:34px;width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.titol-pag{font-family:var(--display);font-weight:900;font-size:28px;text-align:center;margin:8px 0 16px}
.seccio{margin-top:24px}
.seccio > h2{font-size:18px;margin-bottom:10px;text-shadow:0 2px 2px rgba(0,0,0,.85)}

/* ---- tria de personatge ---- */
.carrusel{position:relative;height:360px;margin-top:4px}
.carrusel figure{position:absolute;bottom:0;margin:0;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s,filter .4s}
.carrusel figure img{height:100%;width:auto;display:block;filter:drop-shadow(0 10px 16px rgba(0,0,0,.7))}
.carrusel .actiu{left:50%;height:100%;transform:translateX(-50%);z-index:2}
.carrusel .costat{height:62%;opacity:.45;filter:brightness(.55);z-index:1}
.carrusel .esq{left:-4%}
.carrusel .dre{right:-4%}
.carrusel .pedestal{position:absolute;left:50%;bottom:-8px;width:62%;height:26px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,130,40,.55),rgba(255,90,20,.15) 55%,transparent 70%)}
.fletxa{--x:8px;position:absolute;top:44%;z-index:3;width:44px;height:52px;display:grid;place-items:center;color:var(--flama)}
.fletxa.esq{left:0}.fletxa.dre{right:0}
.fletxa svg{width:22px;height:22px}.fletxa.dre svg{transform:scaleX(-1)}
.fitxa{margin-top:14px;text-align:center}
.fitxa .nom{font-family:var(--display);font-weight:900;font-size:26px}
.fitxa .lema{color:var(--fum)}
.trets{display:grid;gap:9px;margin-top:12px;text-align:left}
.tret{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;font-size:15px;font-weight:700}

/* ---- formularis ---- */
.form{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.form label{display:grid;gap:6px;font-size:14px;font-weight:700;color:var(--fum);min-width:0}
.form input,.form select,.form textarea{width:100%;min-width:0;height:50px;border-radius:8px;border:1px solid var(--bronze-fil);background:#0f0d0c;color:var(--crema);padding:0 12px;font-size:17px}
.form textarea{height:110px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

/* ---- entreno ---- */
.dia{--x:10px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;color:var(--crema)}
.dia .n{font-family:var(--display);font-weight:900;font-size:32px;text-align:center}
.dia .t{font-weight:700;font-size:17px}
.dia .s{font-size:13.5px;color:var(--fum)}
.toca{font-size:12px;font-weight:700;border:1px solid #f0a050;color:#ffdca6;border-radius:999px;padding:3px 10px;white-space:nowrap}
.sessio-cap{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;padding:8px 14px 12px}
.sessio-cap .personatge{height:140px}
.sessio-cap .dia-n{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1}
.sessio-cap .dia-t{color:var(--fum);margin-bottom:8px;font-weight:700}
.exercici{padding:14px;margin-top:14px}
.exercici .fila-cap{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exercici .ej-nom{flex:1;min-width:0}
.ej-foto{flex:none;width:64px;height:64px;padding:0;border:1px solid var(--bronze-fil);border-radius:8px;overflow:hidden;background:#15110e}
.ej-foto img{display:block;width:100%;height:100%;object-fit:cover}
.ej-gran{display:block;width:100%;height:auto;max-width:420px;margin:0 auto;border-radius:12px;border:1px solid var(--bronze-fil)}
.ej-com{font-size:16px;line-height:1.45;margin:14px 2px 4px}
.exercici .nom{font-weight:700;font-size:18px;line-height:1.25}
.objectiu{font-size:14px;font-weight:700;border:1px solid var(--bronze-fil);border-radius:999px;padding:4px 10px;background:#0f0d0c;white-space:nowrap;color:var(--crema)}
.consell{font-size:14px;color:var(--fum);margin:6px 0 0}
.grup{font-size:12.5px;font-weight:700;color:#ffb55e}
.series{display:grid;gap:8px;margin-top:10px}
.serie{display:grid;grid-template-columns:30px 1fr 16px 1fr 52px;gap:8px;align-items:center}
.serie .i{display:grid;place-items:center;width:30px;height:34px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--bronze);color:#1a0f07;font-family:var(--display);font-weight:900;font-size:14px}
.serie .x{text-align:center;color:var(--fum-2)}
.camp{position:relative}
.camp input{width:100%;height:50px;border-radius:8px;border:1px solid var(--bronze-fil);background:#0f0d0c;color:var(--crema);
  font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;padding:0 34px 0 12px}
.camp input::placeholder{color:var(--fum-2);font-weight:400}
.camp .u{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--fum-2);font-size:12px;pointer-events:none}
.serie.feta input{border-color:#f0a050;box-shadow:0 0 10px rgba(255,120,30,.25)}
.xec{width:52px;height:50px;border-radius:8px;border:1px solid var(--bronze-fil);background:#0f0d0c;display:grid;place-items:center;color:var(--fum-2)}
.xec svg{width:26px;height:26px}
.xec[aria-pressed="true"]{border-color:#f0a050;background:radial-gradient(130% 150% at 50% 115%,#e8480e,#a51a05 45%,#6e0a02);color:#fff0cf;box-shadow:0 0 14px rgba(255,90,20,.5)}
.mes-menys{display:flex;gap:10px;margin-top:10px}
.mes-menys .btn{--x:6px;min-height:38px;padding:0 12px;font-size:14px;gap:6px}
.mes-menys .btn svg{width:16px;height:16px}

/* ---- descans: la barra del rellotge de sorra ---- */
.descans{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.descans .caixa{max-width:436px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px}
.descans .temps{font-family:var(--display);font-weight:900;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.descans .accions{display:flex;gap:6px}
.descans .accions button{min-height:40px;padding:0 10px;border-radius:999px;border:1px solid var(--bronze-fil);background:#0f0d0c;color:var(--crema);font-size:14px;font-weight:700}
.descans .barra{grid-column:1/-1;height:8px}
.descansant .app{padding-bottom:140px}

/* ---- gràfiques de pàgina ---- */
.graf svg{width:100%;display:block}
.llegenda{font-size:13px;color:var(--fum);text-align:center;margin-top:6px}
.buit{font-size:14px;color:var(--fum-2);text-align:center;padding:14px 6px}

/* ---- menjar ---- */
.macros{display:grid;grid-template-columns:92px 1fr;gap:6px 12px;align-items:center;padding:10px 14px 12px}
.macros .personatge{height:124px;grid-row:span 2}
.macro{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center}
.macro .ico{width:28px;height:28px}
.macro .et{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.apat{margin-top:10px}
.apat-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px;background:none;border:0;text-align:left;color:var(--crema)}
.apat-cap .t{font-weight:700;font-size:17px}
.apat-cap .r{font-size:13.5px;color:var(--fum)}
.apat-cap svg{width:18px;height:18px;flex:none;transition:transform .2s;color:#ffb55e}
.apat-cap[aria-expanded="true"]{background:linear-gradient(180deg,rgba(180,40,10,.5),rgba(120,20,5,.25))}
.apat-cap[aria-expanded="true"] svg{transform:rotate(180deg)}
.apat-cos{padding:4px 14px 14px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid rgba(197,123,55,.18)}
.item .nom{font-size:15.5px}
.item .q{font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.item .e{grid-column:1/-1;font-size:13px;color:var(--fum)}
.item .sust{grid-column:1/-1;font-size:13px;color:#ffb55e}
.pes-final{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 4px}
.pes-final b{font-size:19px}
.linia-macros{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--fum)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.p{background:#fd5a1e}.dot.c{background:#ffc23a}.dot.g{background:#8ec46a}
.frase{text-align:center;font-size:14px;color:var(--fum);margin-top:18px}
.frase img{width:22px;height:22px;vertical-align:middle;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---- registre ---- */
.reg{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(197,123,55,.18)}
.reg .d{font-size:13px;color:var(--fum)}
.treu{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--fum-2);display:grid;place-items:center}

/* ---- fulls ---- */
.vel{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62)}
.full{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow:auto;background:#12100f;border-top:2px solid #9b5626;
  border-radius:16px 16px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.full .dins{max-width:460px;margin:0 auto}
.full .ansa{width:44px;height:4px;border-radius:2px;background:var(--bronze-fil);margin:4px auto 10px}
.full-cap{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px}
.full-cap h2{font-size:19px}
.tanca{width:44px;height:44px;border-radius:50%;border:1px solid var(--bronze-fil);background:none;color:var(--crema);display:grid;place-items:center}
.interruptor{width:52px;height:30px;border-radius:999px;border:1px solid var(--bronze-fil);background:#1a1512;position:relative;flex:none}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fum-2);transition:transform .2s}
.interruptor[aria-checked="true"]{background:linear-gradient(180deg,#b3200a,#7c0e03);border-color:#f0a050}
.interruptor[aria-checked="true"]::after{transform:translateX(22px);background:#ffe6b6}
.rebost .fila{justify-content:space-between;border-bottom:1px solid rgba(197,123,55,.18);padding:8px 0}
.avis-salut{border:1px solid var(--bronze-fil);border-radius:10px;padding:12px;font-size:14px;background:rgba(0,0,0,.35)}
.text-llarg p{margin:0 0 10px}

/* ---- celebracions ---- */
.celebra{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 40%,rgba(70,20,6,.94),rgba(0,0,0,.97) 70%)}
.celebra .caixa{width:min(100%,400px);text-align:center;animation:entra .5s cubic-bezier(.2,.8,.2,1)}
.celebra .gran{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.05}
.celebra .xp-guanyat{font-family:var(--display);font-weight:900;font-size:54px;color:#ffe6b6;margin:10px 0 0;text-shadow:0 0 18px rgba(255,120,30,.8)}
.celebra .sub{color:var(--fum);margin-top:4px;font-weight:700}
.celebra .fila-ratxa{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0}
.celebra .fila-ratxa svg{width:44px;height:52px;animation:batega 1s ease-in-out infinite}
@keyframes entra{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes batega{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.flota{position:fixed;z-index:61;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:22px;color:#ffe6b6;
  text-shadow:0 0 12px rgba(255,120,30,.9);animation:puja 1.2s ease-out forwards}
.flota.record{color:#ffd08a;font-size:24px}
@keyframes puja{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-240%) scale(1)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:62;max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:999px;background:#1a1512;border:1px solid #f0a050;color:#ffe6b6;font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.descansant .toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.lector{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- les rutines ---- */
.rutina,.rutina-act{--x:10px;display:grid;gap:6px;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;color:var(--crema)}
.rutina-cap{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rutina-nom{font-weight:700;font-size:17px;line-height:1.25}
.rutina-dades{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--fum)}
.estrelles{display:inline-flex;gap:1px;vertical-align:middle}
.ciencia{padding:9px 0;border-bottom:1px solid rgba(197,123,55,.18)}
.ciencia:last-child{border-bottom:0}
.ciencia p{margin:3px 0;font-size:14px}.ciencia small{color:var(--fum-2);font-size:12px}
.rutina-fitxa{text-align:center}.rutina-fitxa p{margin:6px 0 0}
.dia-rut{margin-top:10px}
.ej-llista{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ej-mini{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(197,123,55,.25);font-size:13px}
.ej-mini img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.dia-ed{margin-top:12px}
.dia-ed .form input{height:42px}

/* ---- el rècord: salta enmig de l'entreno, sense aturar-lo ---- */

.pop-record .pr-raig{position:absolute;width:320px;height:320px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,190,70,.38) 0 10deg,transparent 10deg 24deg);

.pop-record .pr-cos{position:relative;padding:14px 24px 12px;border-radius:14px;text-align:center;

@keyframes esquerda{to{opacity:1}}
@keyframes tros{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(160deg)}}
.gel-text{color:#9fd8ff}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.st,.xp-fila,.oro-guanyat,.fila-ratxa,.gel-text{opacity:1}.gel-bloc,.gel-tros{display:none}}

      return titol(ordre[i]);
    }
    function para() { clearInterval(fos); fos = apaga(el); }
    const sona = () => !!el && !el.paused;
    // L'ambient de la fragua (cops, foc que crepita): fluix i en bucle quan la música és encesa però en
    // aquell moment no té cançons. Amb el botó de música apagat, silenci: ni música ni ambient.
    let amb = null;
    function ambient() {

      hiHa: m => llista(m).length > 0, titol: () => (ordre.length && el && el.src ? titol(ordre[i]) : "") };
  })();

  // <input type="checkbox" switch> fa un toc quan canvia, i n'hi ha prou de clicar-ne l'etiqueta
  // (dins d'un gest de l'usuari). Un patró de l'Android es tradueix en fins a tres tocs.
  let tocIOS = null;
  function tocaIOS() {
    try {
      if (!tocIOS) {
        tocIOS = document.createElement("label");
        tocIOS.setAttribute("aria-hidden", "true");
        tocIOS.style.cssText = "position:fixed;left:-50px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none";

    tocaIOS();
    for (let i = 1; i < n; i++) setTimeout(tocaIOS, i * 110);
  }

  // El text que puja: «+10 XP».
  function flota(txt, x, y, clase = "") {
    const el = document.createElement("div");
    el.className = "flota " + clase; el.textContent = txt;
    el.style.left = x + "px"; el.style.top = y + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  // Cada botó: foc on el toques, so i una vibració curta.
  function toque(ev) {
    const x = ev.clientX || (ev.touches && ev.touches[0].clientX) || innerWidth / 2;
    const y = ev.clientY || (ev.touches && ev.touches[0].clientY) || innerHeight / 2;
    lanza(x, y, 14, 0.9); suena("tap"); vibra(8);
  }

  return { lanza, lluvia, suena, teSo, vibra, flota, toque, poco, Musica };
})();

/* FRAGUA · l'ambient viu del fons (26/09/2026).
   L'Albert: «molaria que hi hagués una capa de foc real i boira darrere... com un espai». Damunt de la
   pintura de la fragua (fons.webp) s'hi dibuixa, en temps real i amb un sol shader: el foc que es mou a
   l'arc de la fragua, la boira que passa arran de terra i les brases que pugen. Es pinta a poca
   resolució (el foc i la boira són tous) i a 30 fotogrames per segon, es para quan la pàgina no es veu,
   i amb «reduir el moviment» es queda quiet en un sol fotograma. Si no hi ha WebGL, no hi és i prou. */
"use strict";
const Ambient = (() => {
  // On és l'arc del foc dins de fons.webp (fraccions de la imatge), i com el col·loca el CSS del .fons.
  const ARC = { x: 0.118, y: 0.345, r: 0.15 }, IMG = { w: 900, h: 1350 }, POS_X = 0.22;
  const ESCALA = 0.42, FPS = 30;
  const FRAG = `precision mediump float;
uniform vec2 res; uniform float t; uniform vec2 arc; uniform float arcR; uniform float asp;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 1.7; a *= 0.5; } return v; }
void main(){
  vec2 uv = gl_FragCoord.xy / res;
  vec2 pa = vec2(uv.x * asp, uv.y);
  // la boira: dues capes que es mouen a velocitats diferents, més espessa a baix
  vec2 q = pa * vec2(1.4, 2.4);
  float b = fbm(q + vec2(t * 0.035, -t * 0.01) + 0.8 * fbm(q * 0.6 - vec2(t * 0.02, 0.0)));
  float boira = smoothstep(0.42, 0.88, b) * (0.22 + 0.9 * smoothstep(0.7, 0.0, uv.y));
  float aprop = smoothstep(0.75, 0.0, distance(pa, vec2(arc.x * asp, arc.y)));
  vec3 cBoira = mix(vec3(0.30, 0.20, 0.15), vec3(0.95, 0.45, 0.16), aprop);
  // el foc de l'arc: llengües que pugen, retallades a la boca de la fragua
  vec2 fp = (vec2(uv.x * asp, uv.y) - vec2(arc.x * asp, arc.y)) / arcR;
  float boca = smoothstep(1.05, 0.35, length(fp * vec2(0.95, 0.75)));
  float ll = fbm(vec2(fp.x * 2.6, fp.y * 1.7 - t * 1.35)) + fbm(vec2(fp.x * 5.0 + 3.1, fp.y * 3.2 - t * 2.1)) * 0.5;
  float foc = boca * smoothstep(0.55, 1.15, ll + 0.35 - fp.y * 0.35);
  float bat = 0.82 + 0.18 * noise(vec2(t * 4.0, 1.3));
  vec3 cFoc = mix(vec3(0.95, 0.28, 0.03), vec3(1.0, 0.82, 0.38), smoothstep(0.2, 0.9, foc));
  // les brases: punts que pugen oscil·lant
  float br = 0.0;
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    vec2 g = vec2(pa.x * 7.0 + fi * 4.7, pa.y * 7.0 - t * (0.28 + 0.12 * fi));
    vec2 id = floor(g); vec2 f = fract(g) - 0.5;
    float h = hash(id + fi * 13.1);
    if (h > 0.9) {
      vec2 o = vec2(hash(id + 1.3) - 0.5, hash(id + 2.1) - 0.5) * 0.5 + vec2(0.18 * sin(t * 1.3 + h * 30.0), 0.0);
      br += smoothstep(0.075, 0.0, length(f - o)) * (0.55 + 0.45 * sin(t * 2.7 + h * 40.0)) * smoothstep(1.0, 0.15, uv.y);
    }
  }
  vec3 col = cBoira * boira * 0.42 + cFoc * foc * 0.9 * bat + vec3(1.0, 0.6, 0.2) * br * 0.9 + vec3(1.0, 0.45, 0.12) * aprop * 0.05 * bat;
  gl_FragColor = vec4(col, 1.0);
}`;
  let gl = null, cv = null, prog = null, loc = {}, t0 = performance.now(), ultim = 0, rafId = 0;
  const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function compila(tipus, codi) {
    const sh = gl.createShader(tipus); gl.shaderSource(sh, codi); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) || "shader");
    return sh;
  }
  function mida() {
    const W = innerWidth, H = innerHeight;
    cv.width = Math.max(64, Math.round(W * ESCALA)); cv.height = Math.max(64, Math.round(H * ESCALA));
    gl.viewport(0, 0, cv.width, cv.height);
    // on cau l'arc a la pantalla, amb el mateix «cover» i la mateixa posició que el CSS del .fons
    const k = Math.max(W / IMG.w, H / IMG.h), iw = IMG.w * k, ih = IMG.h * k;
    const ox = (W - iw) * POS_X, oy = 0;
    const ax = (ox + ARC.x * iw) / W, ay = 1 - (oy + ARC.y * ih) / H;
    gl.uniform2f(loc.res, cv.width, cv.height);
    gl.uniform2f(loc.arc, ax, ay);
    gl.uniform1f(loc.arcR, ARC.r * iw / H);
    gl.uniform1f(loc.asp, W / H);
  }
  function pinta(ara) {
    rafId = 0;
    if (document.hidden) return;
    if (ara - ultim >= 1000 / FPS - 2) {
      ultim = ara;
      gl.uniform1f(loc.t, (ara - t0) / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    if (!quiet) rafId = requestAnimationFrame(pinta);
  }
  function engega() {
    try {
      cv = document.createElement("canvas");
      cv.className = "ambient"; cv.setAttribute("aria-hidden", "true");
      gl = cv.getContext("webgl", { alpha: false, antialias: false, premultipliedAlpha: false, powerPreference: "low-power" });
      if (!gl) return;
      prog = gl.createProgram();
      gl.attachShader(prog, compila(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
      gl.attachShader(prog, compila(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
      gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const p = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
      for (const n of ["res", "t", "arc", "arcR", "asp"]) loc[n] = gl.getUniformLocation(prog, n);
      document.querySelector(".fons").after(cv);
      mida();
      addEventListener("resize", mida);
      document.addEventListener("visibilitychange", () => { if (!document.hidden && !rafId && !quiet) rafId = requestAnimationFrame(pinta); });
      rafId = requestAnimationFrame(pinta);
    } catch (e) { if (cv) cv.remove(); gl = null; }
  }
  engega();
  return { actiu: () => !!gl };
})();

const nouId = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const copia = r => ({ id: nouId(), nombre: r.nombre, resumen: r.resumen || "", dias: r.dias.map(d => ({ t: d.t, ej: d.ej.map(e => [...e]) })) });
function accioRutina(acc, b) {
  switch (acc) {
    case "rut-ver": S.ui.rutVer = b.dataset.id; veure("rutina"); return true;
    case "rut-usar": {
      const r = totesRutinas().find(x => x.id === b.dataset.id); if (!r || !rutinaTeva(r)) return true;
      if (S.activa) { avis("Termina o descarta el entreno en marcha antes de cambiar de rutina.", true); return true; }
      S.rutinaActiva = r.id; guardar(); veure("entreno"); Efectos.suena("triar"); avis(`Ahora entrenas con «${r.nombre}».`); return true;
    }
    case "rut-comprar": {
      const r = PLANTILLAS.find(x => x.id === b.dataset.id); if (!r || rutinaTeva(r) || oroTotal() < r.precio) return true;
      S.oroGastado = (S.oroGastado || 0) + r.precio; S.rutinasDesbloq = [...(S.rutinasDesbloq || []), r.id]; guardarYa();
      Efectos.suena("gel-destral"); setTimeout(() => Efectos.suena("gel-trenca"), 280); setTimeout(() => { if (!Efectos.suena("cofre")) Efectos.suena("fanfarria"); }, 650);
      Efectos.lluvia(1.2); Efectos.vibra([30, 40, 60]); render(); avis(`«${r.nombre}» es tuya.`); return true;
    }
    case "rut-nova": S.ui.edit = { id: nouId(), nombre: "Mi rutina", dias: [{ t: "Día 1", ej: [] }] }; guardar(); veure("editor"); return true;
    case "rut-copiar": { const r = totesRutinas().find(x => x.id === b.dataset.id); if (!r) return true; S.ui.edit = copia(r); S.ui.edit.nombre = r.nombre + " (mía)"; guardar(); veure("editor"); return true; }
    case "rut-editar": { const r = rutinaPropia(b.dataset.id); if (!r) return true; S.ui.edit = JSON.parse(JSON.stringify(r)); guardar(); veure("editor"); return true; }
    case "rut-borrar": { S.rutinas = (S.rutinas || []).filter(x => x.id !== b.dataset.id); guardar(); veure("rutinas"); Efectos.suena("apaga"); return true; }
    case "ed-dia": llegeixEditor(); S.ui.edit.dias.push({ t: "Día " + (S.ui.edit.dias.length + 1), ej: [] }); guardar(); render(); return true;
    case "ed-treu-dia": llegeixEditor(); if (S.ui.edit.dias.length > 1) S.ui.edit.dias.splice(+b.dataset.i, 1); guardar(); render(); return true;
    case "ed-afegeix": llegeixEditor(); obreFull(fullTriaEj(+b.dataset.i), "Añadir ejercicio"); return true;
    case "ed-posa": { const e = catalogo(b.dataset.n); S.ui.edit.dias[+b.dataset.i].ej.push([...e]); guardar(); tancaFull(); render(); Efectos.suena("yunque"); return true; }
    case "ed-treu": llegeixEditor(); S.ui.edit.dias[+b.dataset.i].ej.splice(+b.dataset.j, 1); guardar(); render(); return true;
    case "ed-puja": { llegeixEditor(); const ll = S.ui.edit.dias[+b.dataset.i].ej, j = +b.dataset.j; if (j > 0) [ll[j - 1], ll[j]] = [ll[j], ll[j - 1]]; guardar(); render(); return true; }
    case "ed-desa": {
      llegeixEditor();
      const r = S.ui.edit, dies = r.dias.filter(d => d.ej.length);
      if (!dies.length) { avis("Añade al menos un ejercicio.", true); return true; }

      Efectos.suena("fanfarria"); Efectos.lluvia(1); veure("rutina"); avis("Rutina guardada.");

}

/* FRAGUA · la càrrega: els discos del teu gimnàs, com es carrega cada exercici i la progressió (26/09/2026).
   L'Albert: «s'ha de posar sí o sí un esquema de com combinar els pesos per arribar a la quantitat de kg
   que necessites a cada exercici, per no haver de comptar si són 2 de 10 o 2 de 20 i 1,25... a Ajustes
   s'hauria de poder posar quins discos té disponibles el teu gimnàs» i «que automàticament la propera
   vegada que facis l'exercici ja tinguis guardat el que vas fer i l'app et millori el pes i les repes».
   La regla és la doble progressió de LVDVS (primer repeticions, després pes). El salt de pes, en %, surt
   de l'ACSM (2009): «un 2-10 % més de càrrega quan pots fer una o dues repeticions més de les que
   busques». Aquí, un 5 % als exercicis grans i un 2,5 % als petits (dins del 2-10), redondejat al que hi
   ha al gimnàs: discos, mancuernes o plaques. Tot es canvia a Ajustes.
   Va al mateix <script> que motor.js i app.js, entre tots dos. */
"use strict";

const GIM_BASE = { barra: 20, multipower: 20, discos: [25, 20, 15, 10, 5, 2.5, 1.25], mancuernas: 2, placas: 5 };
const PROGRES_BASE = { c: 5, a: 2.5, dos: false };
const DISCOS_TOTS = [25, 20, 15, 10, 5, 2.5, 2, 1.25, 1, 0.5];
// L'alçada de cada disc respecte al de 25 (diàmetres de discos calibrats: 450, 400, 325, 230, 190 i 160 mm).
const MIDA_DISC = { 25: 1, 20: 1, 15: .89, 10: .72, 5: .51, 2.5: .42, 2: .42, 1.25: .36, 1: .36, 0.5: .3 };
const gim = () => ({ ...GIM_BASE, ...(S.gym || {}) });
const progres = () => ({ ...PROGRES_BASE, ...(S.progres || {}) });

// Com es carrega cada exercici. Amb discos: quants costats i què pesa el que no és disc (la barra).
// Amb mancuernes o plaques (polea, màquina de pila): de quant en quant va.
const CARGAS = {
  barra: { nom: "Barra", lados: 2, base: () => gim().barra, on: "Por lado" },
  multipower: { nom: "Multipower", lados: 2, base: () => gim().multipower, on: "Por lado" },
  discos: { nom: "Máquina de discos", lados: 2, base: () => 0, on: "Por lado" },
  "un-lado": { nom: "Discos en un lado", lados: 1, base: () => 0, on: "En un lado" },
  lastre: { nom: "Lastre", lados: 1, base: () => 0, on: "En el cinturón" },
  mancuernas: { nom: "Mancuernas", paso: () => gim().mancuernas },
  placas: { nom: "Placas o polea", paso: () => gim().placas },
};
const ORDRE_CARGAS = ["barra", "multipower", "discos", "un-lado", "lastre", "mancuernas", "placas"];
// El que és més habitual en un gimnàs; cadascú ho canvia a la fitxa de l'exercici.
const CARGA_DEF = {
  "Press de pecho en máquina": "placas", "Press plano en máquina": "placas", "Press inclinado": "mancuernas",
  "Press inclinado en Smith": "multipower", "Fondos": "lastre", "Peck Deck": "placas", "Press militar": "barra",
  "Elevaciones laterales en polea": "placas", "Elevaciones laterales en polea baja": "placas", "Elevaciones posteriores en polea": "placas",
  "Dominadas": "lastre", "Dominadas lastradas": "lastre", "Jalón al pecho": "placas", "Remo Gironda": "placas",
  "Remo unilateral": "mancuernas", "Remo en T": "un-lado", "Extensión lumbar": "placas",
  "Curl de bíceps en banco": "mancuernas", "Curl de bíceps en banco con soporte": "mancuernas",
  "Curl de bíceps unilateral en banco": "mancuernas", "Curl martillo": "mancuernas",
  "Extensión de tríceps": "placas", "Extensión de tríceps tipo katana en polea": "placas",
  "Hack Squat": "discos", "Prensa de piernas": "discos", "Extensión de cuádriceps": "placas",
  "Curl femoral tumbado": "placas", "Curl femoral sentado": "placas",
  "Abducción de cadera en máquina": "placas", "Aducción de cadera en máquina": "placas", "Elevación de gemelos": "placas",
};
function cargaDe(nombre, extra) {
  const c = (S.cfg[nombre] || {}).carga;
  if (c && CARGAS[c]) return c;
  return CARGA_DEF[nombre] || (extra === "lastre" ? "lastre" : "placas");
}
// El salt d'un exercici de mancuernes o de plaques: el seu, si en té; si no, el del gimnàs. Els «fins»
// (elevacions laterals i posteriors) pugen de 2,5 com a molt: 5 kg d'un cop en una elevació és massa.
function pasoDe(nombre, extra, carga) {
  const p = (S.cfg[nombre] || {}).paso;
  if (p > 0) return p;
  const base = CARGAS[carga].paso();
  return extra === "fino" && carga === "placas" ? Math.min(2.5, base) : base;
}

/* ---- els discos: amb quins es fa cada pes ----
   Es treballa en quarts de quilo (1,25 = 5) i es busca la combinació de MENYS discos; entre dues igual de
   curtes, la dels discos grans primer. Val per a qualsevol joc de discos, també els rars (2 kg, 0,5 kg). */
const QK = 4, MAX_Q = 300 * QK;
let taula = null, taulaDe = "";
function taulaDiscos() {
  const ds = [...new Set(gim().discos)].map(d => Math.round(d * QK)).filter(d => d > 0).sort((a, b) => b - a);
  const clau = ds.join(",");
  if (taula && taulaDe === clau) return taula;
  const min = new Int16Array(MAX_Q + 1).fill(32767), tria = new Int16Array(MAX_Q + 1);
  min[0] = 0;
  for (let u = 1; u <= MAX_Q; u++) for (const d of ds) if (d <= u && min[u - d] + 1 < min[u]) { min[u] = min[u - d] + 1; tria[u] = d; }
  taula = { min, tria }; taulaDe = clau;
  return taula;
}
// Els discos d'un costat, del més gran al més petit; null si amb aquests discos no surt exacte.
function discosLado(kgLado) {
  const u = Math.round(kgLado * QK);
  if (u < 0 || u > MAX_Q) return null;
  const t = taulaDiscos();
  if (t.min[u] >= 32767) return null;
  const out = []; let r = u;
  while (r > 0) { out.push(t.tria[r] / QK); r -= t.tria[r]; }
  return out.sort((a, b) => b - a);
}
const potLado = u => u >= 0 && u <= MAX_Q && taulaDiscos().min[u] < 32767;
// El pes total que es pot fer més a prop per dalt (dir 1) o per baix (dir -1) d'un pes; null si no n'hi ha.
function veiDe(kg, carga, dir) {
  const C = CARGAS[carga];
  if (C.paso) {
    const p = C.paso(), k = kg / p;
    const n = dir > 0 ? Math.floor(k + 1e-6) + 1 : Math.ceil(k - 1e-6) - 1;
    return n >= (carga === "lastre" ? 0 : 1) ? +(n * p).toFixed(2) : null;
  }
  const base = C.base(), lado = (kg - base) / C.lados;
  let u = dir > 0 ? Math.floor(lado * QK + 1e-6) + 1 : Math.ceil(lado * QK - 1e-6) - 1;
  for (; u >= 0 && u <= MAX_Q; u += dir) if (potLado(u)) return +(base + C.lados * u / QK).toFixed(2);
  return null;
}
function esPot(kg, carga) {
  const C = CARGAS[carga];
  if (C.paso) { const k = kg / C.paso(); return Math.abs(k - Math.round(k)) < 1e-6 && kg > 0; }
  const lado = (kg - C.base()) / C.lados, u = lado * QK;
  return Math.abs(u - Math.round(u)) < 1e-6 && potLado(Math.round(u));
}
// El més a prop d'un pes; si n'hi ha dos a la mateixa distància, el de sota.
function mesAprop(kg, carga) {
  if (esPot(kg, carga)) return kg;
  const a = veiDe(kg, carga, -1), b = veiDe(kg, carga, 1);
  if (a == null) return b; if (b == null) return a;
  return kg - a <= b - kg ? a : b;
}
// Pujar un % (la progressió): el pes que es pot fer més a prop del que toca, i com a mínim un esglaó.
function pujaKg(kg, pct, carga, lastre) {
  const pes = S.perfil && S.perfil.peso;
  // amb llast, el % és del que mous de debò: tu més el llast
  const objectiu = lastre && pes ? (pes + kg) * (1 + pct / 100) - pes : kg * (1 + pct / 100);
  let n = mesAprop(objectiu, carga);
  if (n == null || n <= kg + 1e-6) n = veiDe(kg, carga, 1);
  return n == null ? kg : n;
}
function baixaKg(kg, pct, carga, lastre) {
  const pes = S.perfil && S.perfil.peso;
  const objectiu = lastre && pes ? (pes + kg) * (1 - pct / 100) - pes : kg * (1 - pct / 100);
  let n = mesAprop(Math.max(0, objectiu), carga);
  if (n == null || n >= kg - 1e-6) n = veiDe(kg, carga, -1);
  return n == null ? kg : n;
}

/* ---- la progressió ----
   «Que ja et surti el kg i el número de reps predefinit si ho has fet alguna altra vegada. I el número
   de reps augmentat o bé kg: quan arribis al màxim de reps en les 3 sèries ja et puja el pes un %».
   - Totes les sèries al màxim del rang: puja el pes (el % d'Ajustes) i les repeticions tornen a baix.
   - Si no: el mateix pes i una repetició més a cada sèrie que no era al màxim.
   - Totes per sota del mínim: el pes era massa, baixa el mateix %. */
function vegades(nombre, excepto, n) {
  const out = [];
  for (let i = S.ses.length - 1; i >= 0 && out.length < n; i--) {
    const s = S.ses[i];
    if (s.id === excepto || !s.fin) continue;
    const e = s.ej.find(x => x.n === nombre);
    if (e && e.sets.some(z => z.ok)) out.push({ fecha: s.fecha, sets: e.sets.filter(z => z.ok) });
  }
  return out;
}
function progresion(nombre, tipo, extra, excepto) {
  const c = cfgEj(nombre, tipo), carga = cargaDe(nombre, extra), lastre = extra === "lastre";
  const [u, abans] = vegades(nombre, excepto, 2);
  if (!u) return { modo: "primera", c, carga };
  const P = progres(), pct = tipo === "c" ? P.c : P.a;
  const alMax = v => v && v.sets.length >= c.series && v.sets.every(z => (z.reps || 0) >= c.max);
  const plantilla = j => u.sets[Math.min(j, u.sets.length - 1)];
  const sets = Array.from({ length: c.series }, (_, j) => ({ ...plantilla(j) }));
  if (alMax(u) && (!P.dos || alMax(abans))) {
    const fora = sets.map(z => ({ kg: pujaKg(z.kg ?? 0, pct, carga, lastre), reps: c.min }));
    return { modo: "sube", c, carga, u, pct, sets: fora, de: Math.max(...u.sets.map(z => z.kg ?? 0)), a: Math.max(...fora.map(z => z.kg)) };
  }
  if (alMax(u) && P.dos) return { modo: "confirma", c, carga, u, pct, sets: sets.map(z => ({ kg: z.kg ?? (lastre ? 0 : null), reps: c.max })) };
  const top = Math.max(...u.sets.map(z => z.kg ?? 0));
  if (u.sets.every(z => (z.reps || 0) < c.min) && top > 0) {
    const fora = sets.map(z => ({ kg: baixaKg(z.kg ?? 0, pct, carga, lastre), reps: c.min }));
    return { modo: "baja", c, carga, u, pct, sets: fora, de: top, a: Math.max(...fora.map(z => z.kg)) };
  }
  return { modo: "reps", c, carga, u, sets: sets.map(z => ({ kg: z.kg ?? (lastre ? 0 : null), reps: Math.min((z.reps || 0) + 1, c.max) })) };
}

/* ---- el que es veu ---- */
const I_PUJA = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 4l7 9h-4.5v7h-5v-7H5z" fill="currentColor"/></svg>';
const I_BAIXA_P = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 20l7-9h-4.5V4h-5v7H5z" fill="currentColor"/></svg>';
const kgTxt = v => fmt(Math.round(v * 100) / 100);
function chipProg(p, i) {
  const [cls, ico, txt] = {
    sube: ["sube", I_PUJA, `${kgTxt(p.a)} kg`],
    baja: ["baja", I_BAIXA_P, `${kgTxt(p.a)} kg`],
    reps: ["reps", I_PUJA, "1 rep"],
    confirma: ["reps", I_PUJA, "Confirma"],
    primera: ["nova", "", "Primera vez"],
  }[p.modo];
  return `<button class="prog ${cls}" data-accion="ej-prog" data-i="${i}" aria-label="Tu progresión en este ejercicio">${ico}${txt}</button>`;
}
// L'esquema: la barra (o la banya de la màquina) amb els discos d'un costat, del gran al petit, cadascun
// amb el seu número. Amb llast, els discos de cara, que és com es veuen penjats del cinturó.
function htmlCarga(kg, carga) {
  const C = CARGAS[carga];
  if (!C || C.paso || !(kg > 0)) return "";
  const base = C.base(), lado = (kg - base) / C.lados;
  if (lado < -1e-6) return `<div class="carga buida"><span class="carga-on">Menos que la barra (${kgTxt(base)} kg)</span></div>`;
  let d = discosLado(lado), aprox = null;
  if (!d) { aprox = mesAprop(kg, carga); d = discosLado((aprox - base) / C.lados) || []; }
  const nota = aprox != null ? `<span class="carga-aprox">No sale exacto: ${kgTxt(aprox)} kg</span>` : "";
  if (!d.length) return `<div class="carga buida"><span class="carga-on">${carga === "barra" || carga === "multipower" ? "Solo la barra" : "Sin discos"}</span>${nota}</div>`;
  if (carga === "lastre")
    return `<div class="carga lastre"><span class="carga-on">${C.on}</span><div class="carga-cares">${d.map(p => `<span class="dc" style="--m:${MIDA_DISC[p] || .4}"><img src="${ACTIUS}discos/cara-${p}.webp" alt=""><b>${kgTxt(p)}</b></span>`).join("")}</div>${nota}</div>`;
  const barra = carga === "barra" || carga === "multipower" ? `<span class="carga-base">${carga === "barra" ? "Barra" : "Multipower"} de ${kgTxt(base)} kg</span>` : "";

/* FRAGUA · el cos: les mesures (26/09/2026).

   Cadascú tria a Ajustes què apunta. Del que feia LVDVS: el % de greix amb la cinta (mètode de la Marina
   dels EUA), amb la seva franja d'error, i la massa magra i el seu índex per l'alçada (FFMI). Sense

"use strict";

// [clau, nom, unitat, [mínim, màxim], com es pren]
const MEDIDAS = [
  ["cintura", "Cintura", "cm", [40, 200], "A la altura del ombligo, relajado y al soltar el aire."],

  ["brazo", "Brazo", "cm", [15, 70], "A mitad del brazo, relajado y colgando."],
  ["muslo", "Muslo", "cm", [30, 110], "A medio camino entre la cadera y la rodilla."],
  ["gemelo", "Gemelo", "cm", [20, 70], "Por la parte más ancha."],

const BASCULA = [

  ["musculo", "Masa muscular", "kg", [10, 150]],
  ["agua", "Agua", "%", [20, 80]],
  ["visceral", "Grasa visceral", "nivel", [1, 59]],
];
const MEDIR_BASE = { cintura: true, pecho: true };
const medir = () => ({ ...MEDIR_BASE, ...(S.medir || {}) });

/* ---- el % de greix amb la cinta: Marina dels EUA, versió mètrica (com a LVDVS) ----
   Error típic contra una DEXA: uns 3,4 punts (Foulis et al., Front Physiol 2023, n = 926). */
const GREIX_ERROR = 3;
function greixCinta(sexo, altura, cintura, cuello, cadera) {
  if (!(altura && cintura && cuello)) return null;
  let v;

    if (!cadera) return null;
    const d = cintura + cadera - cuello; if (d <= 0) return null;
    v = 495 / (1.29579 - 0.35004 * Math.log10(d) + 0.22100 * Math.log10(altura)) - 450;
  } else if (sexo === "h") {
    const d = cintura - cuello; if (d <= 0) return null;
    v = 495 / (1.0324 - 0.19077 * Math.log10(d) + 0.15456 * Math.log10(altura)) - 450;
  } else return null;

}
// L'últim valor conegut de cada mesura (cada dia pot portar-ne només unes quantes).
function ultimes() {
  const u = {};

  return u;
}
function composicion() {
  const u = ultimes(), pr = S.perfil;

  const peso = (u.peso && u.peso.v) || pr.peso;
  const g = greixCinta(pr.sexo, pr.altura, u.cintura && u.cintura.v, u.cuello && u.cuello.v, u.cadera && u.cadera.v);
  if (g == null || !peso) return { falta: true };
  const h = pr.altura / 100, magra = peso * (1 - g / 100);
  return { grasa: g, banda: [Math.max(2, g - GREIX_ERROR), g + GREIX_ERROR], magra, grasaKg: peso - magra,
    ffmi: magra / (h * h) + 6.3 * (1.8 - h) };
}

/* ---- la pantalla: la pestanya «Cuerpo» d'Estadísticas ---- */
function sparkline(vals, w = 88, h = 26) {
  if (vals.length < 2) return "";

function tarjaMesura(k) {

    <span class="m-dif">${d == null ? (ult ? fechaCorta(ult.f) : "Sin datos") : `${d > 0 ? "+" : ""}${fmt(d)} desde el ${fechaCorta(pri.f)}`}</span>${sparkline(serie.map(m => m[k]))}</button>`;

/* ---- el mode demostració ---- */
const CLAU_REAL = "fragua.v1.real";
function estatDemo() {
  const dia = 864e5, ara = Date.now(), r = rutinaActual();
  const st = Object.assign(BASE(), { personaje: S.personaje, perfil: { ...S.perfil, peso: S.perfil.peso || 68, altura: S.perfil.altura || 172 },
    rutinaActiva: S.rutinaActiva, rutinas: S.rutinas, rutinasDesbloq: S.rutinasDesbloq, musica: S.musica, sonido: S.sonido, haptica: S.haptica,
    gym: S.gym, progres: S.progres, medir: { ...medir(), cuello: true, brazo: true }, demo: true, xpVisto: 1e9, nivelVisto: 99,
    ui: { tab: "hoy", abiertas: {}, vista: "inicio" } });
  const k = d => clave(d);
  const dies = [];
  for (let w = 9; w >= 1; w--) for (const d of [6, 4, 2]) dies.push(w * 7 + d);
  dies.push(5, 3, 1);
  const base = {};
  dies.forEach((fa, idx) => {
    const t = new Date(ara - fa * dia); t.setHours(18, 30, 0, 0);
    const n = idx % r.dias.length, d = r.dias[n], prog = idx / dies.length;
    const ej = d.ej.map(([nom, tipo, x]) => {
      if (base[nom] == null) base[nom] = (tipo === "c" ? 40 : 12) + (nom.length % 7) * 3;
      const kg = x === "lastre" ? Math.round(prog * 8 / 1.25) * 1.25 : Math.round(base[nom] * (1 + prog * 0.18) / 2.5) * 2.5;
      const [mn, mx] = rangoDe(tipo);
      return { n: nom, t: tipo, x, sets: [0, 1, 2].map(i => ({ kg, reps: Math.max(mn, Math.min(mx, mx - 1 - i + (idx % 3 === 0 ? 1 : 0))), ok: true })) };
    });
    st.ses.push({ id: "demo" + idx, dia: n + 1, rut: r.id, dt: d.t, fecha: k(t), inicio: t.getTime(), fin: t.getTime() + 64 * 60000, ej });
  });
  st.medidas = [];
  for (let w = 9; w >= 0; w--) {
    const t = new Date(ara - (w * 7 + 1) * dia), p = (9 - w) / 9;
    st.medidas.push({ f: k(t), peso: Math.round((st.perfil.peso - 1.6 + p * 2.2) * 10) / 10, cintura: Math.round((81.5 - p * 2.4) * 10) / 10,
      pecho: Math.round((95 + p * 3.1) * 10) / 10, cuello: 37 + Math.round(p * 5) / 10, brazo: Math.round((32.5 + p * 1.8) * 10) / 10 });
  }
  st.perfil.peso = st.medidas[st.medidas.length - 1].peso;
  return st;
}
function demo(on) {
  try {
    if (on) { localStorage.setItem(CLAU_REAL, JSON.stringify(S)); S = estatDemo(); }
    else { const t = localStorage.getItem(CLAU_REAL); S = t ? Object.assign(BASE(), JSON.parse(t)) : BASE(); localStorage.removeItem(CLAU_REAL); }
  } catch (e) { avis("No se ha podido cambiar: este navegador no deja guardar.", true); return; }
  guardarYa(); render(); window.scrollTo({ top: 0 });
  avis(on ? "Datos de ejemplo. Tus datos están guardados aparte." : "Vuelven tus datos.");
}

/* ---- els gestos d'Ajustes; torna true si era seu ---- */
function accioAjustes(acc, b) {
  const G = gim(), P = progres();
  const desa = () => { guardar(); render(); };
  switch (acc) {
    case "aj-obre": S.ui.ajOberta = S.ui.ajOberta === b.dataset.k ? null : b.dataset.k; desa(); return true;
    case "aj-disc": {
      const d = Number(b.dataset.d), hi = G.discos.includes(d);
      if (hi && G.discos.length === 1) { avis("Deja al menos un disco.", true); return true; }
      S.gym = { ...G, discos: hi ? G.discos.filter(x => x !== d) : [...G.discos, d].sort((x, y) => y - x) }; desa(); return true;
    }
    case "aj-mancu": S.gym = { ...G, mancuernas: Number(b.dataset.v) }; desa(); return true;
    case "aj-placas": S.gym = { ...G, placas: Number(b.dataset.v) }; desa(); return true;
    case "aj-pct": { const v = Math.min(10, Math.max(1, P[b.dataset.k] + Number(b.dataset.d))); S.progres = { ...P, [b.dataset.k]: v }; desa(); return true; }
    case "aj-dos": S.progres = { ...P, dos: !P.dos }; desa(); return true;
    case "aj-desc": { const t = b.dataset.k, v = Math.min(300, Math.max(30, descansoDe(t) + Number(b.dataset.d))); S.descansos = { ...DESCANSO, ...(S.descansos || {}), [t]: v }; desa(); return true; }
    case "aj-med": S.medir = { ...medir(), [b.dataset.k]: !medir()[b.dataset.k] }; desa(); return true;
    case "aj-cinta": {
      const on = !medir().cinta;
      S.medir = { ...medir(), cinta: on, ...(on ? { cintura: true, cuello: true } : {}), ...(on && S.perfil.sexo === "m" ? { cadera: true } : {}) }; desa(); return true;
    }
    case "aj-sexo": S.perfil = { ...S.perfil, sexo: b.dataset.s }; if (b.dataset.s === "m") S.medir = { ...medir(), cadera: true }; desa(); return true;
    case "aj-demo": demo(!S.demo); return true;
  }
  return false;
}
// Els camps que es desen en canviar (no a cada tecla): el pes de les barres i els rangs de repeticions.
function canviAjustes(t) {
  if (t.dataset.aj) {
    const v = num(t.value);
    if (!(v >= 0 && v <= 60)) { avis("Pon un peso entre 0 y 60 kg.", true); t.value = fmt(gim()[t.dataset.aj]); return true; }
    S.gym = { ...gim(), [t.dataset.aj]: v }; guardar(); avis("Guardado."); return true;
  }
  if (t.dataset.ajRang) {
    const [a, b] = t.value.split("-").map(Number);
    S.rangos = { ...RANGO, ...(S.rangos || {}), [t.dataset.ajRang]: [a, b] }; guardar(); avis("Guardado."); return true;
  }
  return false;
}

function grafLinia(vals, w = 102, h = 74, buit = false) {

  const pts = vals.map((x, i) => x == null ? null : [6 + i * (w - 12) / (vals.length - 1), h - 8 - (x - mn) / rang * (h - 20)]).filter(Boolean);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${graella(w, h)}

function grafBarres(vals, w = 102, h = 74, etiquetes = null, buit = false) {
  const mx = Math.max(...vals) || 1, n = vals.length, amp = (w - 6) / n, peu = etiquetes ? 13 : 3;
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="2" x2="${w - 2}" y1="${h - peu}" y2="${h - peu}" stroke="rgba(197,123,55,.3)"/>
    ${vals.map((x, i) => { const bh = Math.max(2, x / mx * (h - peu - 6)); const bx = 3 + i * amp + amp * 0.14;
      return `<rect x="${bx.toFixed(1)}" y="${(h - peu - bh).toFixed(1)}" width="${(amp * 0.72).toFixed(1)}" height="${bh.toFixed(1)}" fill="${buit ? "none" : "url(#gFoc)"}"${buit ? ' stroke="rgba(201,178,142,.3)" stroke-dasharray="2 2"' : ""}/>`; }).join("")}
    ${etiquetes ? etiquetes.map((t, i) => `<text x="${(3 + i * amp + amp / 2).toFixed(1)}" y="${h - 2}" text-anchor="middle" font-size="9" font-weight="700" fill="#c9b28e" font-family="Noto Serif,Georgia,serif">${esc(t)}</text>`).join("") : ""}</svg>`;
}
function grafAnell(frac, text) {
  const r = 41, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg viewBox="0 0 100 100" aria-hidden="true" style="height:92px">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#654a3f" stroke-width="11"/>
    ${f > 0 ? `<circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#gAnell)" stroke-width="11" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)" filter="url(#brill)"/>` : ""}
    <text x="50" y="49" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6e3b8" font-family="Noto Serif,Georgia,serif" style="font-stretch:85%">${esc(text)}</text>
    <g transform="translate(40.5 54) scale(.8)">${BRAC.replace(/<svg[^>]*>|<\/svg>/g, "")}</g></svg>`;
}
function grafRadar(eixos) {
  const n = eixos.length, cx = 120, cy = 104, R = 74;
  const punt = (i, f) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; };
  const anells = [0.33, 0.66, 1].map(f => `<polygon points="${eixos.map((_, i) => punt(i, f).map(x => x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="rgba(197,123,55,.25)"/>`).join("");
  const val = eixos.map((e, i) => punt(i, Math.max(0.04, e.valor)).map(x => x.toFixed(1)).join(",")).join(" ");
  const et = eixos.map((e, i) => { const [x, y] = punt(i, 1.24); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6e3b8" font-family="Noto Serif,Georgia,serif">${esc(e.grupo)}</text>`; }).join("");
  return `<svg viewBox="0 0 240 210" aria-label="Series por grupo muscular esta semana">${anells}
    ${eixos.map((_, i) => { const [x, y] = punt(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(197,123,55,.2)"/>`; }).join("")}
    <polygon points="${val}" fill="rgba(253,80,10,.32)" stroke="#ffa030" stroke-width="2" filter="url(#brill)"/>${et}</svg>`;
}
function grafConstancia(dies) {
  const cel = 13, gap = 3, setm = Math.ceil(dies.length / 7);
  let s = "";
  dies.forEach((d, i) => {
    const col = Math.floor(i / 7), fila = i % 7;
    s += `<rect x="${col * (cel + gap)}" y="${fila * (cel + gap)}" width="${cel}" height="${cel}" fill="${d.entreno ? "url(#gFoc)" : "#1c1917"}" stroke="${d.entreno ? "#ffa030" : "rgba(197,123,55,.2)"}" stroke-width=".7"/>`;
  });
  return `<svg viewBox="0 0 ${setm * (cel + gap)} ${7 * (cel + gap)}" aria-label="Días entrenados, últimas 12 semanas">${s}</svg>`;
}
// La força: per a cada una de les últimes 8 setmanes, la mitjana del millor 1RM de cada exercici
// dividit pel primer que en tenim. 1 = com vas començar; 1,08 = un 8 % més fort.
function serieFuerza() {
  const fetes = S.ses.filter(s => s.fin).sort((a, b) => a.inicio - b.inicio);
  const primer = {}, setm = Array.from({ length: 8 }, () => ({}));
  const ara = Date.now();
  fetes.forEach(s => s.ej.forEach(e => e.sets.forEach(z => {
    if (!z.ok || !z.reps || e.x === "lastre" || !z.kg) return;
    const v = Stats.e1rm(z.kg, z.reps);
    if (!primer[e.n]) primer[e.n] = v;
    const fa = Math.floor((ara - s.fin) / (7 * 864e5));
    if (fa < 8) setm[7 - fa][e.n] = Math.max(setm[7 - fa][e.n] || 0, v);
  })));
  const out = setm.map(m => { const k = Object.keys(m); return k.length ? k.reduce((a, n) => a + m[n] / primer[n], 0) / k.length : null; });
  return out.filter(x => x != null).length >= 2 ? out : null;
}

  return [I("atun", 80, 80, 10), I("yogur", 200, 200, 25), I("fiambre_pavo", 80, 80, 10), I("huevo", 2, 2, 1, "ud"), I("leche", 300, 300, 25), I("frutos_secos", 30, 30, 5)]
    .filter(it => !falta(it.a)).map(it => ({ ...it, q: it.lo })).map(it => ({ it, p: macrosDe(it).p }))
    .filter(o => o.p >= 6).sort((a, b) => Math.abs(meta - a.p) - Math.abs(meta - b.p)).slice(0, 3);
}
function fullFaltaProt() {
  const obj = objetivoProt(), t = totalDia(hoy());
  if (!obj) return "<p>Pon tu peso en Ajustes y te digo cuánta proteína te falta.</p>";
  const falten = obj.lo - t.p;
  if (falten <= 0) return `<p>Hoy ya llevas ${n0(t.p)} g, dentro de tu rango. No hace falta añadir nada.</p>`;
  return `<p>Llevas ${n0(t.p)} g y tu rango empieza en ${obj.lo} g: te faltan unos ${n0(falten)} g. Sin montar una comida enorme, añade una de estas:</p>` +
    candidatsProt(falten).map((o, i) => `<div class="item"><div class="nom">${esc(val(o.it.a).n)}</div><div class="q">${cantidadTxt(o.it)}</div><div class="e">${esc(val(o.it.a).e)}, unos ${n0(o.p)} g de proteína</div><div style="grid-column:1/-1;margin-top:6px"><button class="btn marc" data-accion="afegeix-prot" data-i="${i}">Apuntarlo</button></div></div>`).join("");
}

// EL RESUM DE L'ENTRENO, com un joc (Albert, 26/09: «al resum final les stats que surtin animades, i
// l'experiència guanyada, igual que un joc, amb sons»). Cada peça entra per torn, amb el seu so i vibració.
function resumFinal(o) {
  const T0 = 520, PAS = 320;
  const peces = [[o.series, o.series === 1 ? "serie" : "series"], [o.kg, "kg movidos"], [o.min, "minutos"], [o.rec, o.rec === 1 ? "récord" : "récords"]];
  const tXp = T0 + 4 * PAS, tOr = tXp + 900, tR = tOr + 700;
  celebra(`<div class="gran or entra-gran">¡ENTRENO FORJADO!</div>
    <div class="stats-fi">${peces.map(([v, et], i) => `<div class="st" style="animation-delay:${T0 + i * PAS}ms"><b class="or num" data-compta="${v}" data-quan="${T0 + i * PAS}">0</b><span>${et}</span></div>`).join("")}</div>
    <div class="xp-fila" style="animation-delay:${tXp}ms"><div class="xp-guanyat" id="xp-guanyat">+0 XP</div>
      <div class="barra" style="margin-top:6px"><i id="barra-nivell" style="width:${(o.abans.enNivel / o.abans.paraSubir * 100).toFixed(1)}%"></i></div><div class="sub num">NV ${o.abans.nivel}</div></div>
    <div class="oro-guanyat" style="animation-delay:${tOr}ms">${MONEDA}<b class="or num" data-compta="${o.oro}" data-quan="${tOr}" data-signe="+">+0</b> de oro</div>
    <div class="fila-ratxa" style="animation-delay:${tR}ms;--t:${tR}ms">${o.salvada ? `<span class="ratxa-gel">${flama(true)}<i class="gel-bloc"></i><i class="gel-tros t1"></i><i class="gel-tros t2"></i><i class="gel-tros t3"></i><i class="gel-tros t4"></i></span>` : flama(true)}<div style="font-weight:700;font-size:21px">${o.rDes} ${o.rDes === 1 ? "día" : "días"} de racha</div></div>
    ${o.salvada ? `<div class="sub gel-text" style="animation-delay:${tR + 1000}ms">Tu día de descanso no apagó el fuego: racha salvada</div>` : ""}`,
    o.des.nivel > o.abans.nivel ? "¡SUBES DE NIVEL!" : "SEGUIR");
  document.querySelectorAll("#celebra [data-compta]").forEach(el => {
    const fins = +el.dataset.compta, quan = +el.dataset.quan, signe = el.dataset.signe || "";
    setTimeout(() => { if (signe) Efectos.suena("or"); else Efectos.suena("tic"); Efectos.vibra(10); comptaNum(el, fins, signe); }, quan);
  });
  setTimeout(() => { compta($("#xp-guanyat"), o.des.xp - o.abans.xp); const bi = $("#barra-nivell"); if (bi) bi.style.width = (o.des.nivel > o.abans.nivel ? 100 : o.des.enNivel / o.des.paraSubir * 100).toFixed(1) + "%"; }, tXp);
  if (o.salvada) { setTimeout(() => Efectos.suena("gel-destral"), tR + 250); setTimeout(() => { Efectos.suena("gel-trenca"); Efectos.vibra([40, 30, 60]); }, tR + 550); }
  else if (o.puja) setTimeout(() => Efectos.suena("ratxa"), tR + 100);
}
function comptaNum(el, fins, signe = "", ms = 700) {
  if (!el) return;
  const t0 = performance.now();
  const pas = t => { const f = Math.min(1, (t - t0) / ms); el.textContent = signe + n0(fins * (1 - Math.pow(1 - f, 3))); if (f < 1) requestAnimationFrame(pas); };
  requestAnimationFrame(pas);
}
// El rècord: salta al mig de la pantalla uns segons, sense aturar l'entreno.
function popRecord(nom, abans, ara) {
  const el = document.createElement("div");
  el.className = "pop-record"; el.setAttribute("role", "status");
  el.innerHTML = `<div class="pr-raig"></div><div class="pr-cos"><div class="pr-t or">¡NUEVO RÉCORD!</div><div class="pr-ej">${esc(nom)}</div>
    <div class="pr-n">${abans ? `${n0(abans)} → ` : ""}<b class="or">${n0(ara)} kg</b></div><div class="pr-peu">tu 1RM estimado</div></div>`;
  document.body.appendChild(el);

}
function compta(el, fins, ms = 900) {
  if (!el) return;
  const t0 = performance.now();
  const pas = t => { const f = Math.min(1, (t - t0) / ms); el.textContent = "+" + Math.round(fins * (1 - Math.pow(1 - f, 3))) + " XP"; if (f < 1) requestAnimationFrame(pas); else Efectos.suena("xp"); };
  requestAnimationFrame(pas);
}

<script type="module">
/* FRAGUA · el personatge en 3D (26/09/2026).
   El nan és el model de Tripo amb l'esquelet de Mixamo i els pesos refets a Blender

import * as THREE from "three";

import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// El martell: la A el porta a l'espatlla i el model de Tripo va sense, perquè Mixamo vol el cos sol.
// Es fa aquí amb peces de three.js i va enganxat a l'os de l'esquena, que el porta amb ell.
// El model viatja dins d'un .json (el GLB en base64): els artifacts de claude.ai no serveixen .glb.
const MODELS = { herrero: { json: "3d/herrero.json", martell: true } };
