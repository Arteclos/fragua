const ALT = 1.6;   // el model es porta a aquesta alçada, sigui quina sigui la seva escala d'origen
// LA POSTURA (26/09/2026). La «Breathing Idle» de Mixamo, adaptada a un cos tan ample i de braços tan
// curts, li porta les mans a la panxa i li aixafa les espatlles (es veu igual al Blender: és l'animació,
// no three.js). A cada fotograma, després del mixer, s'obren els braços cap enfora al pla de davant:
// OBRE sencer en repòs, i OBRE_GEST durant els gestos, que ja mouen els braços ells sols.
const OBRE = 0.63, OBRE_GEST = 0.2, OBRE_AVANTBRAC = 0.24;

let nivell = window.FRAGUA_NIVEL || 1;

let rend = null, escena = null, cam = null, rellotge = null, caixa = null, obs = null, corrent = false;
let actiu = null;           // { tipo, arrel, mixer, accions, repos, ample }
const models = {};          // tipo -> Promise<gltf | null>

function prepara() {

function carrega(tipo) {
  if (!models[tipo]) models[tipo] = (async () => {

// La caixa del cos tal com està ara (amb la pell deformada pels ossos), en coordenades del món.
function mesura(obj) {

  // el canvi de tornada es fa al fotograma següent, no a dins de l'actualització del mixer (si s'hi fa,
  // aquell fotograma hi barreja la postura de repòs de l'esquelet, amb els braços amunt)

// Un martell de nan de poques cares: cap de ferro amb dues bandes de bronze i mànec de fusta amb cuir.
// Es munta dret (el cap a +Y), es col·loca a l'esquena en diagonal, amb el cap per damunt de l'espatlla
// dreta, i s'enganxa a l'os Spine2 amb attach(), que conserva on és.
function posaMartell(cos, arrel) {

  const bronze = new THREE.MeshStandardMaterial({ color: 0xb8773a, metalness: 0.85, roughness: 0.36, envMap: envMetall, envMapIntensity: 0.6, ...pla });
  const fusta = new THREE.MeshStandardMaterial({ color: 0x4d2e19, roughness: 0.85, ...pla });
  const cuir = new THREE.MeshStandardMaterial({ color: 0x24160d, roughness: 0.9, ...pla });

  peca(new THREE.CylinderGeometry(0.024, 0.028, 0.98, 7), fusta, 0, 0, 0);
  [-0.36, -0.29, -0.22].forEach(y => peca(new THREE.CylinderGeometry(0.031, 0.031, 0.045, 7), cuir, 0, y, 0));
  peca(new THREE.CylinderGeometry(0.04, 0.03, 0.06, 6), bronze, 0, -0.5, 0);
  peca(new RoundedBoxGeometry(0.33, 0.19, 0.19, 1, 0.028), ferro, 0, 0.5, 0);

  [-1, 1].forEach(k => peca(new THREE.BoxGeometry(0.03, 0.2, 0.2), bronze, k * 0.095, 0.5, 0));
  peca(new THREE.BoxGeometry(0.09, 0.09, 0.2), bronze, 0, 0.5, 0.012).rotation.x = Math.PI / 4;

  m.position.set(0.1, 0.9, -0.23);

// Els ossos que es fan gruixuts. L'eix Y d'un os de Mixamo va al llarg de l'os: el gruix és X i Z. Els

function preparaForca(m) {

  m.aura.position.set(0, ALT * 0.55, -0.45); m.aura.scale.set(ALT * 1.5, ALT * 1.7, 1);
  m.arrel.add(m.aura);
  aplicaNivell(m);
}
function aplicaNivell(m) {
  const f = Math.max(0, Math.min(1, (nivell - 1) / 19));
  m.forca = f;
  if (m.martell) {
    const { grup, ferro, bronze, escala } = m.martell;
    const tier = nivell >= 15 ? 3 : nivell >= 10 ? 2 : nivell >= 5 ? 1 : 0;
    grup.scale.setScalar(escala * [0.85, 1, 1.08, 1.15][tier]);
    ferro.color.setHex([0x6b5646, 0x5e5a56, 0x9aa1a8, 0x3a2a22][tier]);
    ferro.roughness = [0.7, 0.46, 0.3, 0.4][tier];
    bronze.color.setHex([0x6b5646, 0xb8773a, 0xe2b448, 0xf0c050][tier]);
    ferro.emissive.setHex(tier === 3 ? 0xff4a10 : 0x000000); ferro.emissiveIntensity = tier === 3 ? 0.75 : 0;
  }
  if (m.aura) m.aura.material.opacity = nivell >= 12 ? 0.5 : 0;
}
function musculs(m) {
  const M = m.musc; if (!M) return;
  const f = m.forca || 0;
  const b = 0.84 + 0.36 * f, ab = (0.9 + 0.26 * f) / b, cu = 0.9 + 0.22 * f, ca = (0.94 + 0.14 * f) / cu, px = 0.95 + 0.13 * f, pz = 0.95 + 0.1 * f;
  const gruix = (o, x, z) => { if (o) o.scale.set(x, 1, z); };
  M.bracos.forEach(o => gruix(o, b, b)); M.avant.forEach(o => gruix(o, ab, ab)); M.mans.forEach(o => gruix(o, 1 / (b * ab), 1 / (b * ab)));
  M.cuixes.forEach(o => gruix(o, cu, cu)); M.cames.forEach(o => gruix(o, ca, ca));
  gruix(M.pit, px, pz); gruix(M.coll, 1 / px, 1 / pz);
  if (m.aura && m.aura.material.opacity > 0) m.aura.material.opacity = 0.42 + 0.12 * Math.sin(performance.now() / 420);
}
function fuerza(n) {
  if (!n || n === nivell) return;
  nivell = n;
  if (actiu) aplicaNivell(actiu);
}

function torna() {
  if (!actiu || !actiu.repos || actiu.ara === actiu.repos) return;
  const ab = actiu.ara;
  actiu.repos.reset().setEffectiveWeight(1).fadeIn(0.35).play();
  ab.fadeOut(0.35);
  actiu.ara = actiu.repos;
}

function enquadra() {
  if (!rend || !caixa || !caixa.isConnected) return;
  const w = Math.max(1, caixa.clientWidth + 40), h = Math.max(1, caixa.clientHeight + 10);
  rend.setSize(w, h, false);
  cam.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  // per defecte, el cos sencer amb aire; amb data-vista="centre,alçada", només aquell tros del cos
  const [centre, alt] = caixa.dataset.vista ? caixa.dataset.vista.split(",").map(Number) : [ALT * 0.5, ALT * 1.1];
  const ample = (actiu ? actiu.ample : 1) * 1.05;
  const d = Math.max(alt / 2 / t, ample / 2 / (t * cam.aspect));
  cam.position.set(0, centre + alt * 0.03, d);
  cam.lookAt(0, centre, 0);
  cam.near = d / 20; cam.far = d * 6;
  cam.updateProjectionMatrix();
  if (!corrent) rend.render(escena, cam);
}

// Obre els braços al pla de davant del nan. `pes` = quant de repòs hi ha a la barreja (1 quiet, 0 en un gest).
const _q = new THREE.Quaternion(), _qp = new THREE.Quaternion(), _qm = new THREE.Quaternion(), _eix = new THREE.Vector3();
// LA SOTRAGADA (26/09/2026, mesurada amb prova_bucle.py): el mixer del three.js només escriu un os quan
// el valor del clip CANVIA. Just quan el bucle torna a començar el valor queda quiet un parell de
// fotogrames, l'os es quedava amb el gir d'aquest arranjament ja posat, i s'hi tornava a sumar: els
// braços s'obrien el doble de cop (un salt del 17 % de l'alçada del nan) i tornaven. Ara cada os guarda
// la seva postura neta (la del mixer) i el gir es fa sempre a partir d'aquella, mai a sobre del d'abans.
function postura(m, pes) {
  if (!m.bracos || !m.bracos.length) return;
  m.arrel.updateMatrixWorld(true);
  _eix.set(0, 0, 1).applyQuaternion(m.arrel.quaternion);   // cap on mira el nan
  for (const [os, signe, max] of m.bracos) {
    const u = os.userData;
    if (!u.neta) { u.neta = new THREE.Quaternion(); u.feta = new THREE.Quaternion(); u.te = false; }
    // si el mixer no ha escrit l'os aquest fotograma, encara hi ha el gir d'abans: la neta és la guardada
    if (!u.te || !os.quaternion.equals(u.feta)) u.neta.copy(os.quaternion);
    os.quaternion.copy(u.neta);
    const angle = signe * (max === OBRE ? OBRE_GEST + (OBRE - OBRE_GEST) * pes : max * pes);
    if (angle) {
      os.parent.getWorldQuaternion(_qp);
      _qm.setFromAxisAngle(_eix, angle);
      // gir al món → gir local: q = pare⁻¹ · gir · pare
      _q.copy(_qp).invert().multiply(_qm).multiply(_qp);
      os.quaternion.premultiply(_q);
    }
    u.feta.copy(os.quaternion); u.te = true;
  }
}
const pesRepos = m => (m.repos && m.repos.isRunning() ? m.repos.getEffectiveWeight() : m.ara === m.repos ? 1 : 0);

function pas(dt) {
  actiu.mixer.update(dt);
  if (actiu.pendent) { actiu.pendent = false; torna(); }
  // l'obertura dels braços segueix el pes del repòs suavitzat: en tornar d'un gest, el three.js dona al
  // repòs el pes sencer un fotograma abans que comenci el fos, i els braços s'obrien de cop aquell fotograma
  const objectiu = pesRepos(actiu);
  actiu.pes = actiu.pes == null ? objectiu : actiu.pes + (objectiu - actiu.pes) * Math.min(1, dt * 7);
  postura(actiu, actiu.pes);
  musculs(actiu);
}
function tic() {
  const dt = Math.min(0.05, rellotge.getDelta());
  if (actiu) pas(dt);
  rend.render(escena, cam);
}
function engega() { if (corrent) return; corrent = true; rellotge.getDelta(); rend.setAnimationLoop(tic); }
function atura() { if (!rend || !corrent) return; corrent = false; rend.setAnimationLoop(null); }

async function posa(heroi) {
  if (obs && caixa) obs.unobserve(caixa);
  caixa = heroi && heroi.isConnected ? heroi : null;
  if (!caixa) { atura(); return; }
  const tipo = caixa.dataset.tipo;
  if (!MODELS[tipo] || !prepara()) { atura(); return; }
  if (!actiu || actiu.tipo !== tipo) {
    const gltf = await carrega(tipo);
    if (!gltf || caixa !== heroi || !heroi.isConnected) return;   // no ha arribat, o ja som en una altra pantalla
    if (actiu) escena.remove(actiu.arrel);
    actiu = munta(gltf, tipo);
  }
  heroi.appendChild(rend.domElement);
  obs.observe(heroi);
  enquadra();
  rend.render(escena, cam);
  heroi.classList.add("amb3d");   // la il·lustració s'amaga només quan el 3D ja té un fotograma pintat
  engega();
}

// L'app demana un gest. Torna true si l'ha fet en 3D; si no, l'app fa saltar la il·lustració.
function reacciona(gest) {
  if (!actiu || !caixa || !caixa.isConnected || !caixa.classList.contains("amb3d")) return false;
  const nom = (GESTOS[gest] || [gest]).find(n => actiu.accions[n]);
  if (!nom) return false;
  const nova = actiu.accions[nom];
  if (nova === actiu.ara) { nova.reset().play(); return true; }
  nova.reset().setLoop(THREE.LoopOnce, 1);
  nova.clampWhenFinished = true;
  nova.setEffectiveWeight(1).fadeIn(0.25).play();
  if (actiu.ara) actiu.ara.fadeOut(0.25);
  actiu.ara = nova;
  return true;
}

// Una foto del que es veu ara, amb fons transparent: és la que fa servir l'app mentre el model arriba.
function foto() {
  if (!rend || !actiu) return null;
  rend.render(escena, cam);
  return rend.domElement.toDataURL("image/png");
}

// Per a les proves: pinta el clip `nom` a la fracció `frac` de la seva durada, amb o sense l'arranjament
// dels braços, i en torna la foto. Deixa el nan quiet en aquell fotograma (després cal recarregar).
function prova(nom, frac, ambPostura = true) {
  if (!actiu || !actiu.accions[nom]) return null;
  atura();
  const a = actiu.accions[nom];
  actiu.mixer.stopAllAction();
  a.reset().setLoop(THREE.LoopRepeat, Infinity).setEffectiveWeight(1).play();
  actiu.mixer.update(0);
  a.time = frac * a.getClip().duration;
  actiu.mixer.update(0);
  if (ambPostura) postura(actiu, nom === "repos" ? 1 : 0);
  musculs(actiu);
  rend.render(escena, cam);
  return rend.domElement.toDataURL("image/png");
}

// Per a les proves: fa córrer el nan fotograma a fotograma (60 per segon) durant `seg` segons, com ho fa
// tic(), i apunta on són les mans a cada fotograma. Un salt (la «sotragada») és un fotograma on una mà es
// mou molt més que als del voltant. `gests` = [[segon, gest], ...] per provar també els canvis de clip.
function diag(seg = 16, gests = [], bucle = null) {
  if (!actiu) return null;
  atura();
  if (bucle && actiu.repos) actiu.repos.setLoop(THREE[bucle], Infinity);
  const mans = [];
  actiu.arrel.traverse(o => { if (o.isBone && /(Left|Right)Hand$/.test(o.name)) mans.push(o); });
  const v = new THREE.Vector3(), abans = mans.map(() => new THREE.Vector3()), out = [];
  const dt = 1 / 60;
  for (let i = 0; i < seg * 60; i++) {
    for (const [t, g] of gests) if (Math.abs(i * dt - t) < dt / 2) reacciona(g);
    pas(dt);
    let max = 0;
    mans.forEach((m, k) => { m.getWorldPosition(v); if (i) max = Math.max(max, v.distanceTo(abans[k])); abans[k].copy(v); });
    out.push([+(i * dt).toFixed(3), +(max / ALT * 1000).toFixed(2), actiu.repos ? +actiu.repos.time.toFixed(3) : 0]);
  }
  engega();
  return out;
}

window.Escena3D = { reacciona, foto, prova, diag, fuerza, clip: nom => (actiu && actiu.accions[nom] ? actiu.accions[nom].getClip() : null) };
document.addEventListener("fragua:heroe", ev => { posa(ev.detail); });
posa(window.FRAGUA_HEROE || null);

</script>
</body></html>
