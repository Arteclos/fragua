<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fragua"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icono-180.png"><link rel="icon" type="image/png" sizes="192x192" href="icono-192.png"><link rel="manifest" href="manifest.webmanifest"></head><body><title>Fragua</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Noto+Serif:wdth,wght@62.5..100,400..700&display=swap">
<style>
/* FRAGUA, direcció A (26/09/2026). L'Albert: «m'ha agradat molt la versió A... espero que puguis
   clavar-la al pixel». Tot surt de referencies/inici-calma/ref-1.png, amidada: panells de basalt amb
   vora de bronze i les cantonades tallades, una sola llum (la fragua, a l'esquerra, darrere el
   personatge), Cinzel per als rètols en majúscules i Noto Serif per a la resta, i el foc (del vermell
   #fd3601 al groc #fee132) només on hi ha foc: l'XP, les flames, les gràfiques i el botó.
   La referència és de 1024 px d'ample; al mòbil les proporcions es mantenen i la lletra puja un terç,
   perquè a 390 px la de la imatge no es llegiria. */
:root{
  --panell:linear-gradient(180deg,#221e1c 0%,#1b1918 38%,#171514 100%);
  --panell-2:linear-gradient(180deg,#1a1816,#121110);
  --bronze:linear-gradient(160deg,#d8914a 0%,#8b4722 26%,#b76c2f 50%,#6d3414 76%,#a95f29 100%);
  --bronze-fosc:linear-gradient(160deg,#a8622f 0%,#5a2e17 40%,#83461f 70%,#5c2f15 100%);
  --bronze-fil:rgba(197,123,55,.45);
  --crema:#f6e3b8; --fum:#c9b28e; --fum-2:#8f7b66;
  --brasa:#fd3601; --taronja:#ff8a17; --flama:#fee132;
  --verd:#8ee486;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --text:"Noto Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#000;color:var(--crema);font-family:var(--text);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flama);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700}

/* el fons: la fragua de la A, amb l'arc del foc a l'esquerra; fosqueja cap a la dreta i cap avall */
.fons{position:fixed;inset:0;z-index:0;background:#000 url("assets/fons.webp") 22% top/cover no-repeat}
.fons::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.38) 100%),
  linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.2) 40%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.82) 100%)}
.ambient{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:0 12px calc(26px + env(safe-area-inset-bottom,0px))}
.chispas{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---- la lletra ---- */
/* el degradat daurat només es pinta dins de la caixa del text: sense aire a dalt, l'accent de «DÍA» o
   d'«ESTADÍSTICAS» en queda fora i no es veu. El padding li fa lloc i el marge negatiu el compensa. */
.or{background:linear-gradient(180deg,#fff4d2 0%,#f8d78d 45%,#e2a04a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding-top:.2em;margin-top:-.2em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.8))}
.rotul{font-family:var(--display);font-weight:800;letter-spacing:.02em}
.suau{color:var(--fum)}
.petit{font-size:14px}
.num{font-variant-numeric:tabular-nums lining-nums}
.ombra{text-shadow:0 2px 2px rgba(0,0,0,.85)}

/* ---- el marc: bronze amb les cantonades tallades (la peça de tota la A) ----
   La vora és el fons de l'element i el farciment, un ::before a dins amb el mateix tall. */
.marc,.panel{--x:10px;--v:2px;--fons:var(--panell);position:relative;isolation:isolate;background:var(--bronze);border:0;
  clip-path:polygon(var(--x) 0,calc(100% - var(--x)) 0,100% var(--x),100% calc(100% - var(--x)),calc(100% - var(--x)) 100%,var(--x) 100%,0 calc(100% - var(--x)),0 var(--x))}
.marc::before,.panel::before{content:"";position:absolute;inset:var(--v);z-index:-1;background:var(--fons);--y:calc(var(--x) - var(--v) * .59);
  clip-path:polygon(var(--y) 0,calc(100% - var(--y)) 0,100% var(--y),100% calc(100% - var(--y)),calc(100% - var(--y)) 100%,var(--y) 100%,0 calc(100% - var(--y)),0 var(--y))}
.panel.pad{padding:14px}
.bloc{position:relative;margin-top:34px}
.pestanya{position:absolute;left:50%;top:0;z-index:3;transform:translate(-50%,-56%);--x:9px;padding:5px 22px 7px;
  font-family:var(--text);font-weight:700;font-size:20px;line-height:1.15;white-space:nowrap;color:var(--crema);text-shadow:0 2px 2px rgba(0,0,0,.85)}
.bloc > .panel{padding-top:26px}

/* ---- botons ---- */
/* el botó gran és la peça de la A mateixa (boto-lava.webp: la vora de bronze i or, la lava amb
   esquerdes), refeta sense lletres pel ChatGPT i amb les seves proporcions; el text va a sobre */
.forja{position:relative;z-index:3;filter:drop-shadow(0 0 9px rgba(255,100,20,.45)) drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.btn-forja{position:relative;display:grid;place-content:center;justify-items:center;gap:1px;width:100%;aspect-ratio:4.05;min-height:72px;padding:4.2% 9% 2.6%;border:0;
  background:url("assets/boto-lava.webp") center/100% 100% no-repeat;color:var(--crema);transition:transform .12s ease,filter .12s ease}
.btn-forja:hover{filter:brightness(1.08)}
.btn-forja:active{transform:scale(.98)}
.btn-forja span{font-family:var(--display);font-weight:900;font-size:clamp(19px,5.9vw,25px);letter-spacing:.02em;line-height:1.2;padding-top:.08em;filter:drop-shadow(0 2px 0 rgba(60,5,0,.95)) drop-shadow(0 0 6px rgba(80,10,0,.6))}
.btn-forja small{font-family:var(--text);font-weight:700;font-size:clamp(12.5px,3.7vw,15px);line-height:1.2;color:#fde8c0;margin-top:0;text-shadow:0 2px 2px rgba(60,5,0,.95)}
.btn-forja:disabled{filter:grayscale(.6) brightness(.7)}
.btn{--x:7px;--v:1.5px;--fons:var(--panell);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;
  color:var(--crema);font-family:var(--text);font-weight:700;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.clar{--bronze:linear-gradient(180deg,#ffc978,#d06a24 50%,#ffae55);--fons:linear-gradient(180deg,#b3200a,#7c0e03);color:#fff0cf}
.enllac{background:none;border:0;color:#e6a45a;text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:15px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bronze-fil);background:rgba(20,17,15,.92);color:var(--crema);font-size:14.5px;font-weight:700}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#b3200a,#7c0e03);border-color:#f0a050;color:#fff0cf}
.fila{display:flex;align-items:center;gap:10px}
.fila.entre{justify-content:space-between}
.envolta{flex-wrap:wrap}

/* ---- l'entrada: logo, personatge i placa ---- */
.boto-musica{--x:7px;--v:1.5px;position:absolute;right:4px;top:8px;z-index:5;width:40px;height:40px;display:grid;place-items:center;color:var(--flama)}
.sessio-cap .boto-musica{top:8px;right:8px}
.boto-musica[aria-pressed="false"]{color:var(--fum-2)}
.sessio-cap{margin-top:4px}
.logo{position:relative;z-index:1;display:block;width:72%;max-width:330px;margin:10px auto 0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.heroe{position:relative;display:grid;grid-template-columns:48% 1fr;gap:4px;align-items:start;margin-top:-30px}
.heroe .personatge{z-index:2;height:266px;margin-bottom:-46px}
.personatge{position:relative;height:300px}
.personatge .brillo{position:absolute;left:50%;bottom:12%;width:120%;height:70%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 70%,rgba(255,120,30,.28),rgba(255,90,20,.06) 45%,transparent 70%);pointer-events:none}
.personatge img{position:absolute;left:50%;bottom:0;height:100%;width:auto;max-width:125%;transform:translateX(-50%);transform-origin:50% 100%;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.7));animation:respira 3.6s ease-in-out infinite}
.personatge canvas{position:absolute;inset:-10px -20px 0;width:calc(100% + 40px);height:calc(100% + 10px);pointer-events:none}
.personatge.amb3d img{display:none}
.personatge img.foto3d{top:-10px;left:-20px;bottom:auto;width:calc(100% + 40px);height:calc(100% + 10px);max-width:none;object-fit:contain;transform:none;animation:none;filter:none}
.personatge.salta img{animation:salta .6s ease-out}
@keyframes respira{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.012,1.018)}}
@keyframes salta{0%{transform:translateX(-50%) translateY(0)}35%{transform:translateX(-50%) translateY(-14px) scale(1.03)}100%{transform:translateX(-50%) translateY(0)}}

.placa{margin-top:36px;--x:10px;display:grid}
.placa-nom{padding:9px 8px 7px;text-align:center;font-family:var(--display);font-weight:800;font-size:25px;line-height:1.1;word-break:break-word;
  background:linear-gradient(180deg,rgba(255,230,190,.05),rgba(255,230,190,0))}
.placa-nom span{display:inline-block}
.placa-nom.llarg{font-size:20px}.placa-nom.molt-llarg{font-size:17px}
.linia{position:relative;height:2px;margin:0 2px;background:var(--bronze)}
.linia::before,.linia::after{content:"";position:absolute;top:50%;width:7px;height:7px;background:#c27a38;transform:translateY(-50%) rotate(45deg)}
.linia::before{left:-3px}.linia::after{right:-3px}
.placa-nivell{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;padding:10px 10px 9px}
.hexagon{position:relative;display:grid;place-items:center;width:42px;height:48px;background:var(--bronze);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hexagon::before{content:"";position:absolute;inset:2.5px;background:radial-gradient(circle at 50% 35%,#302925,#141110 75%);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hexagon span{position:relative;display:flex;align-items:baseline;gap:1px;font-family:var(--display);font-weight:800;line-height:1}
.hexagon small{font-size:10.5px}.hexagon b{font-size:23px}
.hexagon.dos-xifres small{font-size:9px}.hexagon.dos-xifres b{font-size:18px;letter-spacing:-.03em}
.barra{height:12px;border-radius:6px;background:#141312;box-shadow:0 0 0 1.5px #8e4c24,0 0 0 2.5px #2a150a,inset 0 2px 3px rgba(0,0,0,.8);overflow:hidden}
.barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#fd3601 0%,#ff7a12 45%,#ffb526 75%,#fee132 100%);
  box-shadow:0 0 10px rgba(255,120,20,.75);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xp{font-size:14px;font-weight:700;text-align:right;margin-top:5px;color:var(--crema);text-shadow:0 2px 2px rgba(0,0,0,.85)}
.placa-foc{display:grid;grid-template-columns:44px 1fr;gap:9px;align-items:center;padding:10px 9px 11px 10px}
.emblema{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 50% 64%,#962609 0%,#420e05 56%,#1c0805 100%);
  box-shadow:0 0 0 2px #b8702f,0 0 0 3.5px #2a1409,0 0 0 4.5px #7a3f1b,inset 0 0 10px rgba(0,0,0,.75)}
.emblema::before,.emblema::after{content:"";position:absolute;left:50%;width:9px;height:9px;background:#b8702f;transform:translateX(-50%) rotate(45deg);z-index:-1}
.emblema::before{top:-7px}.emblema::after{bottom:-7px}
.emblema svg{width:28px;height:34px;filter:drop-shadow(0 0 5px rgba(255,120,20,.7))}
.emblema b{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:var(--display);font-weight:900;font-size:13px;color:#fff6da;
  text-shadow:0 1px 2px #5a1200,0 0 5px rgba(0,0,0,.9)}
.foc-t{font-size:12.5px;font-weight:700;line-height:1.2;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.foc-n{font-size:18px;font-weight:700;line-height:1.25;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.flames{display:flex;gap:1px;margin-top:4px}
.flames svg{width:15px;height:19px;flex:none}
.flames .encesa{filter:drop-shadow(0 0 4px rgba(255,110,20,.8))}

/* ---- «Cómo vas» ---- */
.com-vas{position:relative;z-index:3;margin-top:30px}
.com-vas > .panel{--x:12px;padding:24px 8px 9px}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.mini{--x:8px;--v:1.5px;--bronze:var(--bronze-fosc);--fons:var(--panell-2);display:flex;flex-direction:column;min-height:130px;padding:8px 5px 7px;text-align:center}
.mini h3{font-size:12.5px;font-stretch:82%;line-height:1.2;white-space:nowrap;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.mini svg{display:block;width:100%;height:74px;margin-top:4px;flex:1 1 auto}
.mini .dada{font-size:12.5px;font-weight:700;margin-top:3px;color:var(--fum)}
.mini .dada.puja{color:var(--verd)}
.mini .buit{margin:auto 2px;font-size:11.5px;line-height:1.3;color:var(--fum-2)}
.fantasma{position:relative;flex:1 1 auto;display:flex;flex-direction:column}
.fantasma .pista{position:absolute;inset:0;display:grid;place-items:center;padding:0 3px;font-size:11.5px;font-weight:700;font-stretch:88%;line-height:1.25;color:var(--fum);
  text-shadow:0 1px 3px #000,0 0 10px #000,0 0 10px #000}
.mini .gran{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin-top:auto}

.inici-forja{width:84%;margin:16px auto 0}
.eines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:92%;margin:14px auto 0}
.eina{--x:9px;--fons:linear-gradient(180deg,#221e1b,#161413);display:grid;justify-items:center;align-content:center;gap:3px;min-height:76px;padding:8px 4px;
  color:var(--crema);font-weight:700;font-size:14.5px;text-shadow:0 2px 2px rgba(0,0,0,.85);transition:transform .12s ease}
.eina:active{transform:scale(.96)}
.eina img{width:46px;height:46px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}

/* ---- capçalera de les altres pantalles ---- */
.cap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 6px}
.enrere{--x:7px;--v:1.5px;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 8px;color:var(--crema);font-weight:700;font-size:15px}
.enrere svg{width:20px;height:20px}
.cap img{height:34px;width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.titol-pag{font-family:var(--display);font-weight:900;font-size:28px;text-align:center;margin:8px 0 16px}
.seccio{margin-top:24px}
.seccio > h2{font-size:18px;margin-bottom:10px;text-shadow:0 2px 2px rgba(0,0,0,.85)}

/* ---- tria de personatge ---- */
.carrusel{position:relative;height:360px;margin-top:4px}
.carrusel figure{position:absolute;bottom:0;margin:0;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s,filter .4s}
.carrusel figure img{height:100%;width:auto;display:block;filter:drop-shadow(0 10px 16px rgba(0,0,0,.7))}
.carrusel .actiu{left:50%;height:100%;transform:translateX(-50%);z-index:2}
.carrusel .costat{height:62%;opacity:.45;filter:brightness(.55);z-index:1}
.carrusel .esq{left:-4%}
.carrusel .dre{right:-4%}
.carrusel .pedestal{position:absolute;left:50%;bottom:-8px;width:62%;height:26px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,130,40,.55),rgba(255,90,20,.15) 55%,transparent 70%)}
.fletxa{--x:8px;position:absolute;top:44%;z-index:3;width:44px;height:52px;display:grid;place-items:center;color:var(--flama)}
.fletxa.esq{left:0}.fletxa.dre{right:0}
.fletxa svg{width:22px;height:22px}.fletxa.dre svg{transform:scaleX(-1)}
.fitxa{margin-top:14px;text-align:center}
.fitxa .nom{font-family:var(--display);font-weight:900;font-size:26px}
.fitxa .lema{color:var(--fum)}
.trets{display:grid;gap:9px;margin-top:12px;text-align:left}
.tret{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;font-size:15px;font-weight:700}

/* ---- formularis ---- */
.form{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.form label{display:grid;gap:6px;font-size:14px;font-weight:700;color:var(--fum);min-width:0}
.form input,.form select,.form textarea{width:100%;min-width:0;height:50px;border-radius:8px;border:1px solid var(--bronze-fil);background:#0f0d0c;color:var(--crema);padding:0 12px;font-size:17px}
.form textarea{height:110px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

/* ---- entreno ---- */
.dia{--x:10px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;color:var(--crema)}
.dia .n{font-family:var(--display);font-weight:900;font-size:32px;text-align:center}
.dia .t{font-weight:700;font-size:17px}
.dia .s{font-size:13.5px;color:var(--fum)}
.toca{font-size:12px;font-weight:700;border:1px solid #f0a050;color:#ffdca6;border-radius:999px;padding:3px 10px;white-space:nowrap}
.sessio-cap{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;padding:8px 14px 12px}
.sessio-cap .personatge{height:140px}
.sessio-cap .dia-n{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1}
.sessio-cap .dia-t{color:var(--fum);margin-bottom:8px;font-weight:700}
.exercici{padding:14px;margin-top:14px}
.exercici .fila-cap{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exercici .ej-nom{flex:1;min-width:0}
.ej-foto{flex:none;width:64px;height:64px;padding:0;border:1px solid var(--bronze-fil);border-radius:8px;overflow:hidden;background:#15110e}
.ej-foto img{display:block;width:100%;height:100%;object-fit:cover}
.ej-gran{display:block;width:100%;height:auto;max-width:420px;margin:0 auto;border-radius:12px;border:1px solid var(--bronze-fil)}
.ej-com{font-size:16px;line-height:1.45;margin:14px 2px 4px}
.exercici .nom{font-weight:700;font-size:18px;line-height:1.25}
.objectiu{font-size:14px;font-weight:700;border:1px solid var(--bronze-fil);border-radius:999px;padding:4px 10px;background:#0f0d0c;white-space:nowrap;color:var(--crema)}
.consell{font-size:14px;color:var(--fum);margin:6px 0 0}
.grup{font-size:12.5px;font-weight:700;color:#ffb55e}
.series{display:grid;gap:8px;margin-top:10px}
.serie{display:grid;grid-template-columns:30px 1fr 16px 1fr 52px;gap:8px;align-items:center}
.serie .i{display:grid;place-items:center;width:30px;height:34px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--bronze);color:#1a0f07;font-family:var(--display);font-weight:900;font-size:14px}
.serie .x{text-align:center;color:var(--fum-2)}
.camp{position:relative}
.camp input{width:100%;height:50px;border-radius:8px;border:1px solid var(--bronze-fil);background:#0f0d0c;color:var(--crema);
  font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;padding:0 34px 0 12px}
.camp input::placeholder{color:var(--fum-2);font-weight:400}

  if (e.x === "lastre") return S.perfil.peso ? S.perfil.peso + (z.kg || 0) : null;
  return z.kg || 0;
}

/* ---- el nivell: 10 XP per sèrie, 50 per sessió acabada, 25 per rècord ---- */
// «Herrero» ja és el nom d'un personatge: els títols no el poden repetir.
const TITULOS = [[1, "Aprendiz"], [3, "Oficial"], [5, "Veterano"], [8, "Maestro"], [12, "Señor de la forja"], [20, "Leyenda de la montaña"]];
const xpParaSubir = nivel => 100 + 50 * (nivel - 1);
function experiencia(S) {
  let xp = 0;
  const mejor = {};
  finSesiones(S).sort((a, b) => a.inicio - b.inicio).forEach(s => {
    xp += 50;
    s.ej.forEach(e => {
      hechas(e).forEach(z => {
        xp += 10;
        const k = kgReales(e, z, S);
        if (k == null) return;
        const v = e1rm(k, z.reps);
        if (mejor[e.n] && v > mejor[e.n] + 0.01) xp += 25;
        mejor[e.n] = Math.max(mejor[e.n] || 0, v);
      });
    });
  });
  let nivel = 1, resto = xp;
  while (resto >= xpParaSubir(nivel)) { resto -= xpParaSubir(nivel); nivel++; }
  const titulo = TITULOS.filter(([n]) => nivel >= n).pop()[1];
  return { xp, nivel, enNivel: resto, paraSubir: xpParaSubir(nivel), titulo };
}

/* ---- el foc: dies entrenats dels últims 7. Descansar no l'apaga: la seva rutina té 6 dies ---- */
function fuego(S, ahora = Date.now()) {
  const dias = new Set(finSesiones(S).filter(s => ahora - s.fin < 7 * DIA_MS).map(s => s.fecha));
  return { dias: dias.size, de: 7, intensidad: Math.min(1, dias.size / 6) };
}

/* ---- volum setmanal (kg × reps), les últimes n setmanes, la més nova al final ---- */
function volumenSemanal(S, n = 8, ahora = Date.now()) {
  const out = Array.from({ length: n }, (_, i) => ({ semana: n - 1 - i, kg: 0 }));
  finSesiones(S).forEach(s => {
    const hace = Math.floor((ahora - s.fin) / (7 * DIA_MS));
    if (hace >= n) return;
    s.ej.forEach(e => hechas(e).forEach(z => { const k = kgReales(e, z, S); if (k) out[n - 1 - hace].kg += k * z.reps; }));
  });
  return out;
}

/* ---- «Tu armadura»: sèries per grup dels últims 7 dies, 0..1 per al radar ---- */
function armadura(S, ahora = Date.now()) {
  const series = Object.fromEntries(GRUPOS.map(g => [g, 0]));
  finSesiones(S).filter(s => ahora - s.fin < 7 * DIA_MS).forEach(s =>
    s.ej.forEach(e => { const g = GRUPO[e.n]; if (g) series[g] += hechas(e).length; }));
  return GRUPOS.map(g => ({ grupo: g, series: series[g], valor: Math.min(1, series[g] / SERIES_PLENAS) }));
}

/* ---- la força: el millor 1RM estimat de cada exercici, aquest mes contra l'anterior ---- */
function fuerza(S, ahora = Date.now()) {
  const mes = (desde, hasta) => {
    const m = {};
    finSesiones(S).filter(s => ahora - s.fin >= desde && ahora - s.fin < hasta).forEach(s =>
      s.ej.forEach(e => hechas(e).forEach(z => { const k = kgReales(e, z, S); if (k) m[e.n] = Math.max(m[e.n] || 0, e1rm(k, z.reps)); })));
    return m;
  };
  const ahoraM = mes(0, 28 * DIA_MS), antes = mes(28 * DIA_MS, 56 * DIA_MS);
  const comunes = Object.keys(ahoraM).filter(n => antes[n]);
  if (comunes.length < 3) return { pocas: true, ejercicios: comunes.length };
  const cambio = comunes.reduce((a, n) => a + ahoraM[n] / antes[n] - 1, 0) / comunes.length;
  return { pocas: false, cambio, ejercicios: comunes.length };
}

/* ---- la corba d'un exercici: el millor 1RM estimat de cada sessió ---- */
function curvaEjercicio(S, nombre) {
  return finSesiones(S).sort((a, b) => a.inicio - b.inicio).map(s => {
    const e = s.ej.find(x => x.n === nombre); if (!e) return null;
    const v = Math.max(0, ...hechas(e).map(z => { const k = kgReales(e, z, S); return k ? e1rm(k, z.reps) : 0; }));
    return v ? { fecha: s.fecha, valor: v } : null;
  }).filter(Boolean);
}

/* ---- rècords del mes i constància (12 setmanes × 7 dies) ---- */
function records(S, ahora = Date.now()) {
  let n = 0; const mejor = {};
  finSesiones(S).sort((a, b) => a.inicio - b.inicio).forEach(s => s.ej.forEach(e => hechas(e).forEach(z => {
    const k = kgReales(e, z, S); if (!k) return;
    const v = e1rm(k, z.reps);
    if (mejor[e.n] && v > mejor[e.n] + 0.01 && ahora - s.fin < 30 * DIA_MS) n++;
    mejor[e.n] = Math.max(mejor[e.n] || 0, v);
  })));
  return n;
}
function constancia(S, semanas = 12, ahora = new Date()) {
  const dias = new Set(finSesiones(S).map(s => s.fecha));
  const hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  const out = [];
  for (let i = semanas * 7 - 1; i >= 0; i--) {
    const d = new Date(hoy - i * DIA_MS);
    const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    out.push({ fecha: k, entreno: dias.has(k) });
  }
  return out;
}

/* ---- la ratxa, com el Duolingo però sense castigar el descans ----
   Dies seguits complint el pla. La rutina és de 6 dies: UN dia sense entrenar per setmana (de dilluns
   a diumenge) no la trenca; el segon, sí. Avui no compta fins que entrena (encara hi és a temps).
   La ratxa sempre comença i acaba en un dia entrenat: els dies de descans de les puntes no hi sumen. */
const claveDia = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const lunesDe = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return claveDia(x); };
function racha(S, ahora = new Date()) {
  const dias = new Set(finSesiones(S).map(s => s.fecha));
  let d = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  if (!dias.has(claveDia(d))) d.setDate(d.getDate() - 1);
  let n = 0, hastaEntreno = 0; const descanso = {};
  for (let i = 0; i < 800; i++) {
    const k = claveDia(d);
    if (dias.has(k)) { n++; hastaEntreno = n; }
    else { const w = lunesDe(d); if (descanso[w]) break; descanso[w] = true; n++; }
    d.setDate(d.getDate() - 1);
  }
  return hastaEntreno;
}
// Els set dies d'aquesta setmana, de dilluns a diumenge: entrenat, avui o encara no.
function semana(S, ahora = new Date()) {
  const dias = new Set(finSesiones(S).map(s => s.fecha));
  const hoyK = claveDia(ahora);
  const lunes = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()); lunes.setDate(lunes.getDate() - ((lunes.getDay() + 6) % 7));
  return ["L", "M", "X", "J", "V", "S", "D"].map((letra, i) => {
    const d = new Date(lunes); d.setDate(lunes.getDate() + i); const k = claveDia(d);
    return { letra, fecha: k, entreno: dias.has(k), hoy: k === hoyK, futuro: k > hoyK };
  });
}

return { TITULOS, GRUPO, GRUPOS, e1rm, experiencia, xpParaSubir, fuego, volumenSemanal, armadura, fuerza, curvaEjercicio, records, constancia, racha, semana };
})();

/* FRAGUA · la dopamina: espurnes, foc, so i vibració (26/09/2026).
   Albert: «cada botó que apretis que surti foc i hi hagi un so»; «animacions de dopamina com el
   Duolingo cada vegada que completes un entrenament». Tot es dibuixa aquí: cap imatge ni cap so de
   fora. Amb «prefers-reduced-motion» es posen menys partícules, i el so es pot treure a Ajustes. */
"use strict";

const Efectos = (() => {
  const poco = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lienzo = null, ctx = null, parts = [], anim = null, dpr = 1;

  function prepara() {
    if (lienzo) return;
    lienzo = document.createElement("canvas");
    lienzo.className = "chispas";
    lienzo.setAttribute("aria-hidden", "true");
    document.body.appendChild(lienzo);

    const mide = () => {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      lienzo.width = innerWidth * dpr; lienzo.height = innerHeight * dpr;
      lienzo.style.width = innerWidth + "px"; lienzo.style.height = innerHeight + "px";
    };
    mide(); addEventListener("resize", mide);
  }

  // Una espurna: posició, velocitat, vida, mida i color (del groc de la flama al vermell de la brasa).
  function lanza(x, y, n, fuerza = 1, hacia = -1) {
    prepara();
    n = poco ? Math.ceil(n / 4) : n;
    for (let i = 0; i < n; i++) {
      const a = (hacia < 0 ? -Math.PI / 2 : Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 1.1;
      const v = (1.5 + Math.random() * 4.5) * fuerza;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: 1, dec: 0.012 + Math.random() * 0.025,
        r: 1 + Math.random() * 2.4, tono: 18 + Math.random() * 30 });
    }
    if (!anim) anim = requestAnimationFrame(pinta);
  }

  function pinta() {
    ctx.clearRect(0, 0, lienzo.width, lienzo.height);
    ctx.globalCompositeOperation = "lighter";
    parts = parts.filter(p => p.vida > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.985; p.vy *= 0.985; p.vida -= p.dec;
      const r = p.r * dpr * (0.6 + p.vida * 0.6);
      const g = ctx.createRadialGradient(p.x * dpr, p.y * dpr, 0, p.x * dpr, p.y * dpr, r * 4);
      g.addColorStop(0, `hsla(${p.tono + 20},100%,75%,${p.vida})`);
      g.addColorStop(0.35, `hsla(${p.tono},100%,55%,${p.vida * 0.8})`);
      g.addColorStop(1, `hsla(${p.tono - 10},100%,40%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x * dpr, p.y * dpr, r * 4, 0, Math.PI * 2); ctx.fill();
    }
    anim = parts.length ? requestAnimationFrame(pinta) : null;
    if (!anim) ctx.clearRect(0, 0, lienzo.width, lienzo.height);
  }

  // Una pluja d'espurnes que puja des de baix: per a les celebracions.
  function lluvia(segundos = 1.6) {
    const fin = performance.now() + segundos * 1000;
    const tic = () => {
      for (let i = 0; i < (poco ? 1 : 4); i++) lanza(Math.random() * innerWidth, innerHeight + 10, 1, 1.8);
      if (performance.now() < fin) requestAnimationFrame(tic);
    };
    tic();
  }

  /* ---- el so, sintetitzat: res a baixar i res amb drets ---- */
  let audio = null;
  const activo = () => (typeof S === "undefined" || S.sonido !== false);
  function ac() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; } return audio; }
  function tono(f, t0, dur, tipo = "sine", vol = 0.2, destino) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(destino || audio.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function ruido(t0, dur, desde, hasta, vol = 0.25) {
    const n = Math.floor(audio.sampleRate * dur), b = audio.createBuffer(1, n, audio.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = audio.createBufferSource(); s.buffer = b;
    const f = audio.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 0.8;
    f.frequency.setValueAtTime(desde, t0); f.frequency.exponentialRampToValueAtTime(hasta, t0 + dur);
    const g = audio.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g).connect(audio.destination); s.start(t0); s.stop(t0 + dur);
  }
  const SONIDOS = {
    // el toc de cada botó: un cop petit de metall i un bufec de foc
    tap(t) { tono(1760, t, 0.09, "triangle", 0.07); tono(2637, t, 0.06, "sine", 0.03); ruido(t, 0.12, 900, 2400, 0.05); },

    xp(t) { tono(1318.5, t, 0.08, "square", 0.04); tono(1760, t + 0.06, 0.1, "square", 0.04); },

  // Els sons d'Artlist que l'Albert tria (prepara_sons.py → assets/sons/, llista a SONS). Es baixen
  // i es descodifiquen la primera vegada que sona alguna cosa; mentrestant, i per als que no hi són,
  // sona el sintetitzat. Si n'hi ha diversos, s'alternen.
  const MOSTRES = {}, TORN = {};
  const VOLUM = { tap: 0.45, tic: 0.6, xp: 0.6, interruptor: 0.5, tancar: 0.5, pantalla: 0.55, crit: 0.95, fanfarria: 0.9, nivell: 0.95 };
  let baixades = false;
  function baixa() {
    if (baixades || typeof SONS === "undefined" || !audio) return;

  const Musica = (() => {

  const punt = (i, f) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; };
  const anells = [0.33, 0.66, 1].map(f => `<polygon points="${eixos.map((_, i) => punt(i, f).map(x => x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="rgba(197,123,55,.25)"/>`).join("");
  const val = eixos.map((e, i) => punt(i, Math.max(0.04, e.valor)).map(x => x.toFixed(1)).join(",")).join(" ");
  const et = eixos.map((e, i) => { const [x, y] = punt(i, 1.24); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6e3b8" font-family="Noto Serif,Georgia,serif">${esc(e.grupo)}</text>`; }).join("");
  return `<svg viewBox="0 0 240 210" aria-label="Series por grupo muscular esta semana">${anells}
    ${eixos.map((_, i) => { const [x, y] = punt(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(197,123,55,.2)"/>`; }).join("")}
    <polygon points="${val}" fill="rgba(253,80,10,.32)" stroke="#ffa030" stroke-width="2" filter="url(#brill)"/>${et}</svg>`;
}
function grafConstancia(dies) {
  const cel = 13, gap = 3, setm = Math.ceil(dies.length / 7);
  let s = "";
  dies.forEach((d, i) => {
    const col = Math.floor(i / 7), fila = i % 7;
    s += `<rect x="${col * (cel + gap)}" y="${fila * (cel + gap)}" width="${cel}" height="${cel}" fill="${d.entreno ? "url(#gFoc)" : "#1c1917"}" stroke="${d.entreno ? "#ffa030" : "rgba(197,123,55,.2)"}" stroke-width=".7"/>`;
  });
  return `<svg viewBox="0 0 ${setm * (cel + gap)} ${7 * (cel + gap)}" aria-label="Días entrenados, últimas 12 semanas">${s}</svg>`;
}
// La força: per a cada una de les últimes 8 setmanes, la mitjana del millor 1RM de cada exercici
// dividit pel primer que en tenim. 1 = com vas començar; 1,08 = un 8 % més fort.
function serieFuerza() {
  const fetes = S.ses.filter(s => s.fin).sort((a, b) => a.inicio - b.inicio);
  const primer = {}, setm = Array.from({ length: 8 }, () => ({}));
  const ara = Date.now();
  fetes.forEach(s => s.ej.forEach(e => e.sets.forEach(z => {
    if (!z.ok || !z.reps || e.x === "lastre" || !z.kg) return;
    const v = Stats.e1rm(z.kg, z.reps);
    if (!primer[e.n]) primer[e.n] = v;
    const fa = Math.floor((ara - s.fin) / (7 * 864e5));
    if (fa < 8) setm[7 - fa][e.n] = Math.max(setm[7 - fa][e.n] || 0, v);
  })));
  const out = setm.map(m => { const k = Object.keys(m); return k.length ? k.reduce((a, n) => a + m[n] / primer[n], 0) / k.length : null; });
  return out.filter(x => x != null).length >= 2 ? out : null;
}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
/* FRAGUA · el personatge en 3D (26/09/2026).
   El nan és el model de Tripo amb l'esquelet de Mixamo i els pesos refets a Blender
   (3d/munta_personatge.py). Respira quiet («repos») i reacciona quan passa alguna cosa: una sèrie feta,
   el menjar apuntat, l'entreno acabat, un toc amb el dit. Hi ha un sol renderer i un sol canvas: cada
   vegada que l'app repinta una pantalla amb personatge (#personatge), el canvas s'hi muda.
   Si el navegador no té WebGL o el model no arriba, es queda la il·lustració, que ja respira sola amb
   CSS; i els personatges que encara no tenen rig (la forjadora i el geni) van sempre amb la il·lustració. */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// El martell: la A el porta a l'espatlla i el model de Tripo va sense, perquè Mixamo vol el cos sol.
// Es fa aquí amb peces de three.js i va enganxat a l'os de l'esquena, que el porta amb ell.
// El model viatja dins d'un .json (el GLB en base64): els artifacts de claude.ai no serveixen .glb.
const MODELS = { herrero: { json: "3d/herrero.json", martell: true } };
const ARREL = typeof ACTIUS === "string" ? ACTIUS : "assets/";
// Quina animació fa cada gest de l'app. Si el model no la té, la primera de la llista que tingui.
const GESTOS = { tria: ["tria", "celebra"], celebra: ["celebra", "tria"], menjar: ["menjar", "celebra"], serie: ["serie", "tria"] };
const ALT = 1.6;   // el model es porta a aquesta alçada, sigui quina sigui la seva escala d'origen
// LA POSTURA (26/09/2026). La «Breathing Idle» de Mixamo, adaptada a un cos tan ample i de braços tan
// curts, li porta les mans a la panxa i li aixafa les espatlles (es veu igual al Blender: és l'animació,
// no three.js). A cada fotograma, després del mixer, s'obren els braços cap enfora al pla de davant:
// OBRE sencer en repòs, i OBRE_GEST durant els gestos, que ja mouen els braços ells sols.
const OBRE = 0.63, OBRE_GEST = 0.2, OBRE_AVANTBRAC = 0.24;
let envMetall = null;

let rend = null, escena = null, cam = null, rellotge = null, caixa = null, obs = null, corrent = false;
let actiu = null;           // { tipo, arrel, mixer, accions, repos, ample }
const models = {};          // tipo -> Promise<gltf | null>

function prepara() {
  if (rend) return true;
  try {
    rend = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "low-power" });
  } catch (e) { rend = null; return false; }

  // La llum de la fragua: la brasa de davant i de baix, un contrallum taronja i poc cel.
  escena.add(new THREE.HemisphereLight(0xffe3c4, 0x1a0c05, 1.1));
  const brasa = new THREE.DirectionalLight(0xffb070, 1.7); brasa.position.set(-1.4, 0.7, 2.2); escena.add(brasa);
  const contra = new THREE.DirectionalLight(0xff6a1a, 2.4); contra.position.set(1.8, 1.6, -2.2); escena.add(contra);

function carrega(tipo) {
  if (!models[tipo]) models[tipo] = (async () => {
    try {
      const r = await fetch(ARREL + MODELS[tipo].json);
      if (!r.ok) return null;

// La caixa del cos tal com està ara (amb la pell deformada pels ossos), en coordenades del món.
function mesura(obj) {
  obj.updateMatrixWorld(true);
  const bb = new THREE.Box3();
  obj.traverse(o => {
    if (o.isSkinnedMesh) { o.computeBoundingBox(); bb.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); }

}

function munta(gltf, tipo) {
  const cos = gltf.scene;

  const arrel = new THREE.Group();

  const os = re => { let t = null; cos.traverse(o => { if (o.isBone && re.test(o.name)) t = o; }); return t; };
  // [os, signe]: el braç esquerre del nan és a +X (mira cap a +Z), i s'obre girant cap a +Z
  const bracos = [[os(/LeftArm$/), 1, OBRE], [os(/RightArm$/), -1, OBRE], [os(/LeftForeArm$/), 1, OBRE_AVANTBRAC], [os(/RightForeArm$/), -1, OBRE_AVANTBRAC]].filter(b => b[0]);
  postura({ arrel, bracos, repos }, 1);
  // A l'escala d'origen (Mixamo surt en centímetres) i amb els peus a terra, centrat.
  let bb = mesura(arrel);
  cos.scale.multiplyScalar(ALT / Math.max(1e-6, bb.max.y - bb.min.y));
  bb = mesura(arrel);
  const c = bb.getCenter(new THREE.Vector3());
  cos.position.set(-c.x, -bb.min.y, -c.z);
  if (MODELS[tipo].martell) posaMartell(cos, arrel);
  arrel.rotation.y = 0.32;   // una mica girat cap a la placa del nom
  escena.add(arrel);
  // només torna a respirar quan acaba el gest que es veu; un de trepitjat per un altre no compta
  // el canvi de tornada es fa al fotograma següent, no a dins de l'actualització del mixer (si s'hi fa,
  // aquell fotograma hi barreja la postura de repòs de l'esquelet, amb els braços amunt)
  mixer.addEventListener("finished", e => { if (actiu && e.action === actiu.ara) actiu.pendent = true; });
  return { tipo, arrel, mixer, accions, repos, bracos, ample: Math.max(bb.max.x - bb.min.x, 0.5), ara: repos };
}

// Un martell de nan de poques cares: cap de ferro amb dues bandes de bronze i mànec de fusta amb cuir.
// Es munta dret (el cap a +Y), es col·loca a l'esquena en diagonal, amb el cap per damunt de l'espatlla
// dreta, i s'enganxa a l'os Spine2 amb attach(), que conserva on és.
function posaMartell(cos, arrel) {
  let esquena = null;
  cos.traverse(o => { if (o.isBone && /Spine2$/.test(o.name)) esquena = o; });
  if (!esquena) return;
  const pla = { flatShading: true };
  // el metall vol un entorn per reflectir (sense, surt negre o de cartró): només el porta el martell,
  // perquè el nan ja té la llum pintada a la textura
  if (!envMetall) { const pm = new THREE.PMREMGenerator(rend); envMetall = pm.fromScene(new RoomEnvironment(), 0.04).texture; pm.dispose(); }
  const ferro = new THREE.MeshStandardMaterial({ color: 0x5e5a56, metalness: 0.75, roughness: 0.46, envMap: envMetall, envMapIntensity: 0.45, ...pla });
  const bronze = new THREE.MeshStandardMaterial({ color: 0xb8773a, metalness: 0.85, roughness: 0.36, envMap: envMetall, envMapIntensity: 0.6, ...pla });
  const fusta = new THREE.MeshStandardMaterial({ color: 0x4d2e19, roughness: 0.85, ...pla });
  const cuir = new THREE.MeshStandardMaterial({ color: 0x24160d, roughness: 0.9, ...pla });
  const m = new THREE.Group();
  const peca = (geo, mat, x, y, z) => { const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); o.frustumCulled = false; m.add(o); return o; };
  peca(new THREE.CylinderGeometry(0.024, 0.028, 0.98, 7), fusta, 0, 0, 0);
  [-0.36, -0.29, -0.22].forEach(y => peca(new THREE.CylinderGeometry(0.031, 0.031, 0.045, 7), cuir, 0, y, 0));
  peca(new THREE.CylinderGeometry(0.04, 0.03, 0.06, 6), bronze, 0, -0.5, 0);
  peca(new RoundedBoxGeometry(0.33, 0.19, 0.19, 1, 0.028), ferro, 0, 0.5, 0);
  [-1, 1].forEach(k => peca(new RoundedBoxGeometry(0.045, 0.21, 0.21, 1, 0.011), ferro, k * 0.185, 0.5, 0));
  [-1, 1].forEach(k => peca(new THREE.BoxGeometry(0.03, 0.2, 0.2), bronze, k * 0.095, 0.5, 0));
  peca(new THREE.BoxGeometry(0.09, 0.09, 0.2), bronze, 0, 0.5, 0.012).rotation.x = Math.PI / 4;
  // en diagonal a l'esquena: el cap a l'alçada de l'espatlla dreta, al costat del cap i no a sobre
  m.position.set(0.1, 0.9, -0.23);
  m.rotation.set(-0.08, 0, 0.78);
  arrel.add(m);
  arrel.updateMatrixWorld(true);
  esquena.attach(m);
}

function torna() {
  if (!actiu || !actiu.repos || actiu.ara === actiu.repos) return;
  const ab = actiu.ara;
  actiu.repos.reset().setEffectiveWeight(1).fadeIn(0.35).play();
  ab.fadeOut(0.35);
  actiu.ara = actiu.repos;
}

function enquadra() {
  if (!rend || !caixa || !caixa.isConnected) return;
  const w = Math.max(1, caixa.clientWidth + 40), h = Math.max(1, caixa.clientHeight + 10);
  rend.setSize(w, h, false);
  cam.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  // per defecte, el cos sencer amb aire; amb data-vista="centre,alçada", només aquell tros del cos
  const [centre, alt] = caixa.dataset.vista ? caixa.dataset.vista.split(",").map(Number) : [ALT * 0.5, ALT * 1.1];
  const ample = (actiu ? actiu.ample : 1) * 1.05;
  const d = Math.max(alt / 2 / t, ample / 2 / (t * cam.aspect));
  cam.position.set(0, centre + alt * 0.03, d);
  cam.lookAt(0, centre, 0);
  cam.near = d / 20; cam.far = d * 6;
  cam.updateProjectionMatrix();
  if (!corrent) rend.render(escena, cam);
}

// Obre els braços al pla de davant del nan. `pes` = quant de repòs hi ha a la barreja (1 quiet, 0 en un gest).
const _q = new THREE.Quaternion(), _qp = new THREE.Quaternion(), _qm = new THREE.Quaternion(), _eix = new THREE.Vector3();
// LA SOTRAGADA (26/09/2026, mesurada amb prova_bucle.py): el mixer del three.js només escriu un os quan
// el valor del clip CANVIA. Just quan el bucle torna a començar el valor queda quiet un parell de
// fotogrames, l'os es quedava amb el gir d'aquest arranjament ja posat, i s'hi tornava a sumar: els
// braços s'obrien el doble de cop (un salt del 17 % de l'alçada del nan) i tornaven. Ara cada os guarda
// la seva postura neta (la del mixer) i el gir es fa sempre a partir d'aquella, mai a sobre del d'abans.
function postura(m, pes) {
  if (!m.bracos || !m.bracos.length) return;
  m.arrel.updateMatrixWorld(true);
  _eix.set(0, 0, 1).applyQuaternion(m.arrel.quaternion);   // cap on mira el nan
  for (const [os, signe, max] of m.bracos) {
    const u = os.userData;
    if (!u.neta) { u.neta = new THREE.Quaternion(); u.feta = new THREE.Quaternion(); u.te = false; }
    // si el mixer no ha escrit l'os aquest fotograma, encara hi ha el gir d'abans: la neta és la guardada
    if (!u.te || !os.quaternion.equals(u.feta)) u.neta.copy(os.quaternion);
    os.quaternion.copy(u.neta);
    const angle = signe * (max === OBRE ? OBRE_GEST + (OBRE - OBRE_GEST) * pes : max * pes);
    if (angle) {
      os.parent.getWorldQuaternion(_qp);
      _qm.setFromAxisAngle(_eix, angle);
      // gir al món → gir local: q = pare⁻¹ · gir · pare
      _q.copy(_qp).invert().multiply(_qm).multiply(_qp);
      os.quaternion.premultiply(_q);
    }
    u.feta.copy(os.quaternion); u.te = true;
  }
}
const pesRepos = m => (m.repos && m.repos.isRunning() ? m.repos.getEffectiveWeight() : m.ara === m.repos ? 1 : 0);

function pas(dt) {
  actiu.mixer.update(dt);
  if (actiu.pendent) { actiu.pendent = false; torna(); }
  // l'obertura dels braços segueix el pes del repòs suavitzat: en tornar d'un gest, el three.js dona al
  // repòs el pes sencer un fotograma abans que comenci el fos, i els braços s'obrien de cop aquell fotograma
  const objectiu = pesRepos(actiu);
  actiu.pes = actiu.pes == null ? objectiu : actiu.pes + (objectiu - actiu.pes) * Math.min(1, dt * 7);
  postura(actiu, actiu.pes);
}
function tic() {
  const dt = Math.min(0.05, rellotge.getDelta());
  if (actiu) pas(dt);
  rend.render(escena, cam);
}
function engega() { if (corrent) return; corrent = true; rellotge.getDelta(); rend.setAnimationLoop(tic); }
function atura() { if (!rend || !corrent) return; corrent = false; rend.setAnimationLoop(null); }

async function posa(heroi) {
  if (obs && caixa) obs.unobserve(caixa);
  caixa = heroi && heroi.isConnected ? heroi : null;
  if (!caixa) { atura(); return; }
  const tipo = caixa.dataset.tipo;
  if (!MODELS[tipo] || !prepara()) { atura(); return; }
  if (!actiu || actiu.tipo !== tipo) {
    const gltf = await carrega(tipo);
    if (!gltf || caixa !== heroi || !heroi.isConnected) return;   // no ha arribat, o ja som en una altra pantalla
    if (actiu) escena.remove(actiu.arrel);
    actiu = munta(gltf, tipo);
  }
  heroi.appendChild(rend.domElement);
  obs.observe(heroi);
  enquadra();
  rend.render(escena, cam);
  heroi.classList.add("amb3d");   // la il·lustració s'amaga només quan el 3D ja té un fotograma pintat
  engega();
}

// L'app demana un gest. Torna true si l'ha fet en 3D; si no, l'app fa saltar la il·lustració.
function reacciona(gest) {
  if (!actiu || !caixa || !caixa.isConnected || !caixa.classList.contains("amb3d")) return false;
  const nom = (GESTOS[gest] || [gest]).find(n => actiu.accions[n]);
  if (!nom) return false;
  const nova = actiu.accions[nom];
  if (nova === actiu.ara) { nova.reset().play(); return true; }
  nova.reset().setLoop(THREE.LoopOnce, 1);
  nova.clampWhenFinished = true;
  nova.setEffectiveWeight(1).fadeIn(0.25).play();
  if (actiu.ara) actiu.ara.fadeOut(0.25);
  actiu.ara = nova;
  return true;
}

// Una foto del que es veu ara, amb fons transparent: és la que fa servir l'app mentre el model arriba.
function foto() {
  if (!rend || !actiu) return null;
  rend.render(escena, cam);
  return rend.domElement.toDataURL("image/png");
}

// Per a les proves: pinta el clip `nom` a la fracció `frac` de la seva durada, amb o sense l'arranjament
// dels braços, i en torna la foto. Deixa el nan quiet en aquell fotograma (després cal recarregar).
function prova(nom, frac, ambPostura = true) {
  if (!actiu || !actiu.accions[nom]) return null;
  atura();
  const a = actiu.accions[nom];
  actiu.mixer.stopAllAction();
  a.reset().setLoop(THREE.LoopRepeat, Infinity).setEffectiveWeight(1).play();
  actiu.mixer.update(0);
  a.time = frac * a.getClip().duration;
  actiu.mixer.update(0);
  if (ambPostura) postura(actiu, nom === "repos" ? 1 : 0);
  rend.render(escena, cam);
  return rend.domElement.toDataURL("image/png");
}

// Per a les proves: fa córrer el nan fotograma a fotograma (60 per segon) durant `seg` segons, com ho fa
// tic(), i apunta on són les mans a cada fotograma. Un salt (la «sotragada») és un fotograma on una mà es
// mou molt més que als del voltant. `gests` = [[segon, gest], ...] per provar també els canvis de clip.
function diag(seg = 16, gests = [], bucle = null) {
  if (!actiu) return null;
  atura();
  if (bucle && actiu.repos) actiu.repos.setLoop(THREE[bucle], Infinity);
  const mans = [];
  actiu.arrel.traverse(o => { if (o.isBone && /(Left|Right)Hand$/.test(o.name)) mans.push(o); });
  const v = new THREE.Vector3(), abans = mans.map(() => new THREE.Vector3()), out = [];
  const dt = 1 / 60;
  for (let i = 0; i < seg * 60; i++) {
    for (const [t, g] of gests) if (Math.abs(i * dt - t) < dt / 2) reacciona(g);
    pas(dt);
    let max = 0;
    mans.forEach((m, k) => { m.getWorldPosition(v); if (i) max = Math.max(max, v.distanceTo(abans[k])); abans[k].copy(v); });
    out.push([+(i * dt).toFixed(3), +(max / ALT * 1000).toFixed(2), actiu.repos ? +actiu.repos.time.toFixed(3) : 0]);
  }
  engega();
  return out;
}

window.Escena3D = { reacciona, foto, prova, diag, clip: nom => (actiu && actiu.accions[nom] ? actiu.accions[nom].getClip() : null) };
document.addEventListener("fragua:heroe", ev => { posa(ev.detail); });
posa(window.FRAGUA_HEROE || null);

</script>
</body></html>
