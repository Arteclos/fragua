}
function despertaPag(i) {
  const R = resumActiu; if (!R) return;
  R.i = i;
  document.querySelectorAll(".resum-punts i").forEach((p, k) => p.classList.toggle("on", k === i));
  const b = $("#resum-boto"); if (b) b.textContent = i >= R.n - 1 ? "SEGUIR" : "SIGUIENTE";
  if (R.fetes.has(i)) return;
  R.fetes.add(i);
  const pag = document.querySelector(`.resum-pag[data-p="${i}"]`); if (!pag) return;
  pag.classList.add("viva");
  if (i) Efectos.suena("pantalla");
  // les línies es dibuixen des de zero
  pag.querySelectorAll("path.dibuixa").forEach((p, k) => { const l = p.getTotalLength(); p.style.setProperty("--len", l.toFixed(0)); p.style.setProperty("--d", (0.4 + k * 0.22).toFixed(2) + "s"); });
  pag.querySelectorAll("[data-compta]").forEach(el => {
    const fins = +el.dataset.compta, de = +(el.dataset.de || 0), quan = +el.dataset.quan, signe = el.dataset.signe || "";
    setTimeout(() => { Efectos.suena(signe === "+" && el.closest(".oro-guanyat") ? "or" : "tic"); Efectos.vibra(10); comptaDe(el, de, fins, signe); }, quan);
  });
  pag.querySelectorAll("[data-so]").forEach(el => setTimeout(() => { Efectos.suena(el.dataset.so); Efectos.vibra([20, 30, 40]); if (el.classList.contains("r-bossa")) { const r = el.getBoundingClientRect(); Efectos.lanza(r.left + 75, r.top + 60, 36, 1.3); } if (el.classList.contains("r-puja")) Efectos.lluvia(1.6); }, +el.dataset.quan));
  pag.querySelectorAll("[data-ample]").forEach(el => setTimeout(() => { el.style.width = el.dataset.ample + "%"; }, 1500));
  if (i === 2 && R.d.rDes > R.d.rAbans) setTimeout(() => Efectos.suena("ratxa"), 600);
  // el percentil de cada rècord, quan el servidor ha rebut l'entreno d'avui
  if (i === 0 && soc().participa && !S.demo) sincro.then(yo => {
    if (!yo || !yo.percentils) return;
    pag.querySelectorAll(".r-rec[data-n]").forEach(el => { const pc = yo.percentils[el.dataset.n]; if (pc != null) el.querySelector(".r-rec-t").insertAdjacentHTML("beforeend", `<small class="pctil-r">Por encima del <b class="or">${pc} %</b> de la gente de FRAGUA en este ejercicio.</small>`); });
  });
  if (i === 3 && soc().participa && !S.demo) sincro.then(async yo => {
    const el = $("#r-ranking"); if (!el) return;
    if (!yo || yo.poder == null) { el.querySelector("small").textContent = "Sin conexión: lo verás en Social."; return; }
    let pos = null;
    try { const rk = await api("GET", "/ranking?metrica=rango&ambit=amigos&grupo=general"); pos = rk.yo && rk.total > 1 ? `${rk.yo.pos}º de ${rk.total} en tu clan` : null; } catch (e) {}
    const y = yunqueDe(yo.poder), dif = yo.poder_abans != null ? yo.poder - yo.poder_abans : null;
    el.innerHTML = `${imgYunque(yo.poder, "gran")}<div><b>${y.nom} <span class="or num">${n0(yo.poder)}</span>${dif ? ` <span class="${dif > 0 ? "puja" : "baixa"} num">${dif > 0 ? "+" : ""}${n0(dif)}</span>` : ""}</b><small>${pos || "Añade amigos en Social para competir"}.</small></div>`;
    Efectos.suena(dif > 0 ? "record" : "tic"); Efectos.vibra(20);
  });
  if (i === 4) {
    const d = R.d;
    setTimeout(() => { compta($("#r-xp"), d.des.xp - d.abans.xp); const bi = $("#r-barra"); if (bi) bi.style.width = (d.des.nivel > d.abans.nivel ? 100 : d.des.enNivel / d.des.paraSubir * 100).toFixed(1) + "%"; }, 500);
  }
}
function comptaDe(el, de, fins, signe = "", ms = 800) {
  const t0 = performance.now();
  const pas = t => { const f = Math.min(1, (t - t0) / ms); el.textContent = signe + n0(de + (fins - de) * (1 - Math.pow(1 - f, 3))); if (f < 1) requestAnimationFrame(pas); };
  requestAnimationFrame(pas);
}
function resumSeguent() {
  const R = resumActiu, pistes = $("#resum-pistes");

/* ---- Ejercicios: tots els que has fet, amb la seva tendència ---- */
function totsEjercicios() {
  const m = {};
  S.ses.filter(s => s.fin).sort((a, b) => a.inicio - b.inicio).forEach(s => s.ej.forEach(e => {
    const fets = e.sets.filter(z => z.ok && z.reps); if (!fets.length) return;
    const x = m[e.n] || (m[e.n] = { n: e.n, x: e.x, sesiones: 0, series: 0, ultima: null, millor: null, lastre: 0 });
    x.sesiones++; x.series += fets.length; x.ultima = s.fecha;
    fets.forEach(z => { if (e.x === "lastre") { x.lastre = Math.max(x.lastre, z.kg || 0); return; } const v = Stats.e1rm(z.kg || 0, z.reps); if (!x.millor || v > x.millor.v) x.millor = { v, kg: z.kg, reps: z.reps, f: s.fecha }; });
  }));

let mapa = null, capaGims = null, gims = [];
function carregaLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((ok, ko) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = ACTIUS + "lib/leaflet/leaflet.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = ACTIUS + "lib/leaflet/leaflet.js"; js.onload = ok; js.onerror = () => ko(new Error("No se ha podido cargar el mapa.")); document.head.appendChild(js);
  });
}

async function iniciaMapa() {
  const el = $("#mapa"); if (!el) return;
  try { await carregaLeaflet(); } catch (e) { el.innerHTML = `<p class="falta" style="padding:20px">${esc(e.message)}</p>`; return; }

  const c = S.ui.mapaCentre || [41.3874, 2.1686];

  // Les teselles d'OpenStreetMap, enfosquides amb CSS (.mapa-fosc): les fosques de CARTO ja demanen clau (26/09).
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: "mapa-fosc",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(mapa);
  capaGims = L.layerGroup().addTo(mapa);
  mapa.on("moveend", () => { const m = mapa.getCenter(); S.ui.mapaCentre = [m.lat, m.lng]; S.ui.mapaZoom = mapa.getZoom(); guardar(); });

async function buscaGims() {
  if (!mapa) return;
  const c = mapa.getCenter(), radi = Math.min(8000, Math.max(1500, mapa.getBounds().getNorthEast().distanceTo(c)));
  $("#gim-llista").innerHTML = '<p class="suau petit" style="text-align:center">Buscando…</p>';
  const q = `[out:json][timeout:20];(node["leisure"="fitness_centre"](around:${Math.round(radi)},${c.lat.toFixed(5)},${c.lng.toFixed(5)});way["leisure"="fitness_centre"](around:${Math.round(radi)},${c.lat.toFixed(5)},${c.lng.toFixed(5)}););out center 80;`;
  try {
    const r = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(q) });
    const j = await r.json();
    gims = (j.elements || []).map(e => ({ id: `${e.type}/${e.id}`, nom: (e.tags && e.tags.name) || "Gimnasio sin nombre", lat: e.lat ?? (e.center || {}).lat, lon: e.lon ?? (e.center || {}).lon,

      .filter(g => g.lat && g.lon);
    if (gims.length) {
      try { const d = await api("GET", "/gimnasios?ids=" + gims.map(g => g.id).join(",")); gims.forEach(g => Object.assign(g, d[g.id] || {})); } catch (e) {}

/* ---------------------------------------------------------------- Google (Google Identity Services) */
let gPromesa = null;
function carregaGoogle() {
  if (!gPromesa) gPromesa = new Promise((ok, ko) => {
    if (window.google && google.accounts && google.accounts.id) return ok();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = ok; s.onerror = () => ko(new Error("No se ha podido cargar Google."));

  });
  gPromesa.then(() => {

    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: r => entraGoogle(r.credential), ux_mode: "popup" });

}

      S.ui.compte = { ...c, mode: "falta", credential, googleEmail: mail, edat: null }; render(); return;

async function apiCompte(met, ruta, cos) {
  const c = clauApi();
  let r;
  try {
    r = await fetch(API + ruta, { method: met, headers: { "Content-Type": "application/json", ...(c ? { Authorization: `Bearer ${c.id}.${c.token}` } : {}) }, body: cos ? JSON.stringify(cos) : undefined });
  } catch (e) { const er = new Error("Sin conexión con KLONK. Prueba en un rato."); er.status = 0; throw er; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const er = new Error(typeof j.detail === "string" ? j.detail : "KLONK no ha podido hacerlo."); er.status = r.status; er.body = j; throw er; }
  return j;
}

async function despresEntrar(r, nou) {
  desaSessio({ id: r.id, token: r.token, email: r.email || (sessio && sessio.email) || null, salut: false });
  S.cuenta = null;

/* ---------------------------------------------------------------- la sincronització */
function perPujar() {
  const o = JSON.parse(JSON.stringify(S));
  NOMES_AQUI.forEach(k => delete o[k]);
  delete o.modificat;
  if (o.social) delete o.social.rank;
  if (!sessio || !sessio.salut) SALUT.forEach(([a, b]) => { if (b) { if (o[a]) delete o[a][b]; } else delete o[a]; });
  return o;
}
// Unió per id de les llistes que només creixen (sessions, àpats, mesures), i la resta, la del costat més nou.
// Els esborrats es recorden a S.esborrats perquè una còpia vella no els faci tornar.
function fusiona(local, remot) {
  if (!remot) return local;
  const nou = (local.modificat || 0) >= (remot.modificat || 0) ? { ...remot, ...local } : { ...local, ...remot };
  const esb = new Set([...(local.esborrats || []), ...(remot.esborrats || [])]);
  const unio = (a, b, k = "id") => { const m = new Map(); (a || []).concat(b || []).forEach(x => { if (x && !esb.has(x[k]) && !m.has(x[k])) m.set(x[k], x); }); return [...m.values()]; };
  nou.ses = unio(local.ses, remot.ses).sort((x, y) => (x.inicio || 0) - (y.inicio || 0));
  nou.reg = {};
  new Set([...Object.keys(local.reg || {}), ...Object.keys(remot.reg || {})]).forEach(d => { const l = unio((local.reg || {})[d], (remot.reg || {})[d]); if (l.length) nou.reg[d] = l; });
  if (local.medidas || remot.medidas) nou.medidas = unio(local.medidas, remot.medidas, "f");
  nou.desbloq = [...new Set([...(local.desbloq || []), ...(remot.desbloq || [])])];
  nou.esborrats = [...esb].slice(-500);
  NOMES_AQUI.forEach(k => { if (k in local) nou[k] = local[k]; else delete nou[k]; });
  // les dades de salut: si el servidor no les té (sense consentiment), es queden les del mòbil
  SALUT.forEach(([a, b]) => { if (b) { if (local[a] && local[a][b] != null && (!nou[a] || nou[a][b] == null)) nou[a] = { ...nou[a], [b]: local[a][b] }; } else if (local[a] && !nou[a]) nou[a] = local[a]; });
  return nou;
}
let pujaTimer = null, pujant = null, pendent = false, darrerPujat = null;
function programaPuja() {
  if (!teCompte() || S.demo) return;
  pendent = true; clearTimeout(pujaTimer); pujaTimer = setTimeout(puja, 5000);
}
async function puja(intents = 0) {
  if (!teCompte() || S.demo || !pendent) return;
  if (pujant) return pujant;
  pujant = (async () => {
    try {
      // cada toc de la pantalla crida guardar(): si el contingut no ha canviat, no es puja res
      const cos = perPujar(), txt = JSON.stringify(cos);
      if (txt === darrerPujat && versio > 0) { pendent = false; return; }
      S.modificat = Date.now(); cos.modificat = S.modificat;
      const r = await apiCompte("PUT", "/estat", { versio_base: versio, estat: cos });
      darrerPujat = txt; desaVersio(r.versio); aplicaOr(r.or, r.desbloq); pendent = false; senseXarxa(false);
    } catch (e) {
      if (e.status === 409 && e.body && intents < 3) {        // l'altre aparell (o el servidor) en té una de més nova
        S = fusiona(S, e.body.estat); desaVersio(e.body.versio); guardarYa(); pujant = null; return puja(intents + 1);
      }
      if (e.status === 401) { desaSessio(null); render(); return; }
      if (e.status === 0) senseXarxa(true); else avis(e.message, true);
    } finally { pujant = null; }
  })();
  return pujant;
}
// En obrir l'app i en entrar: el que té el servidor, fusionat amb el que hi ha al mòbil.
async function baixaEstat(primer) {
  if (!teCompte() || S.demo) return;
  try {
    const r = await apiCompte("GET", "/estat");
    const abans = JSON.stringify(perPujar());
    if (r.estat && r.versio !== versio) { S = fusiona(S, r.estat); desaVersio(r.versio); guardarYa(); }
    else if (!r.estat) desaVersio(0);
    aplicaOr(r.or, r.desbloq);
    senseXarxa(false);
    if (primer || JSON.stringify(perPujar()) !== abans || !r.estat) { pendent = true; await puja(); }
  } catch (e) {
    if (e.status === 401) { desaSessio(null); render(); }
    else if (e.status === 0) senseXarxa(true);
  }
}
// L'or el mana el servidor: saldo del servidor, més el que s'ha guanyat al mòbil des de l'última pujada.
function aplicaOr(o, desbloq) {
  if (o) S.or_srv = { ...o, guanyatAqui: oroGanado() };
  if (desbloq) S.desbloq = desbloq;
}
const oroServidor = () => S.or_srv && teCompte() ? Math.max(0, S.or_srv.saldo + (oroGanado() - S.or_srv.guanyatAqui)) : null;
// Sense cobertura: es desa al mòbil i es puja en tornar la xarxa. L'avís, a dalt de tot.
// (sense retorn anticipat: S.ui sobreviu a una recàrrega i l'element comença amagat; sempre es posa al dia)
function senseXarxa(on) {
  S.ui.senseXarxa = on; const b = document.getElementById("sense-xarxa");
  if (b) b.hidden = !on;
}
window.addEventListener("online", () => { if (pendent) puja(); else baixaEstat(false); });
setInterval(() => { if (pendent && navigator.onLine !== false) puja(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && pendent) puja(); else if (document.visibilityState === "visible") baixaEstat(false); });

  else if (h.startsWith("#restableix=")) { S.ui.compte = { mode: "restableix", codi: decodeURIComponent(h.slice(12)) }; history.replaceState(null, "", location.pathname); }
}

async function accioCompte(acc, b) {

/* ---------------------------------------------------------------- gràfiques (SVG propi) */
// Totes les gràfiques porten el viewBox a la mida en què es veuen: res de preserveAspectRatio="none",
// que estira els punts en ous.
function graella(w, h) {
  let s = "";
  for (let i = 1; i < 4; i++) s += `<line x1="0" x2="${w}" y1="${(h * i / 4).toFixed(1)}" y2="${(h * i / 4).toFixed(1)}" stroke="rgba(197,123,55,.13)"/>`;
  for (let i = 1; i < 6; i++) s += `<line y1="0" y2="${h}" x1="${(w * i / 6).toFixed(1)}" x2="${(w * i / 6).toFixed(1)}" stroke="rgba(197,123,55,.09)"/>`;
  return s;
}
function grafLinia(vals, w = 102, h = 74, buit = false) {
  const v = vals.filter(x => x != null);
  const mn = Math.min(...v), mx = Math.max(...v), rang = mx - mn || 1;
  const pts = vals.map((x, i) => x == null ? null : [6 + i * (w - 12) / (vals.length - 1), h - 8 - (x - mn) / rang * (h - 20)]).filter(Boolean);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${graella(w, h)}
    <path d="${d}" fill="none" stroke="${buit ? "rgba(201,178,142,.28)" : "url(#gLin)"}" stroke-width="2.2" ${buit ? 'stroke-dasharray="3 3"' : 'filter="url(#brill)"'} stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${buit ? 1.8 : 2.6}" fill="${buit ? "rgba(201,178,142,.3)" : "#ffb030"}"/>`).join("")}</svg>`;
}
function grafBarres(vals, w = 102, h = 74, etiquetes = null, buit = false) {
  const mx = Math.max(...vals) || 1, n = vals.length, amp = (w - 6) / n, peu = etiquetes ? 13 : 3;
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="2" x2="${w - 2}" y1="${h - peu}" y2="${h - peu}" stroke="rgba(197,123,55,.3)"/>
    ${vals.map((x, i) => { const bh = Math.max(2, x / mx * (h - peu - 6)); const bx = 3 + i * amp + amp * 0.14;
      return `<rect x="${bx.toFixed(1)}" y="${(h - peu - bh).toFixed(1)}" width="${(amp * 0.72).toFixed(1)}" height="${bh.toFixed(1)}" fill="${buit ? "none" : "url(#gFoc)"}"${buit ? ' stroke="rgba(201,178,142,.3)" stroke-dasharray="2 2"' : ""}/>`; }).join("")}
    ${etiquetes ? etiquetes.map((t, i) => `<text x="${(3 + i * amp + amp / 2).toFixed(1)}" y="${h - 2}" text-anchor="middle" font-size="9" font-weight="700" fill="#c9b28e" font-family="Noto Serif,Georgia,serif">${esc(t)}</text>`).join("") : ""}</svg>`;
}
function grafAnell(frac, text) {
  const r = 41, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg viewBox="0 0 100 100" aria-hidden="true" style="height:92px">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#654a3f" stroke-width="11"/>
    ${f > 0 ? `<circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#gAnell)" stroke-width="11" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)" filter="url(#brill)"/>` : ""}
    <text x="50" y="49" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6e3b8" font-family="Noto Serif,Georgia,serif" style="font-stretch:85%">${esc(text)}</text>
    <g transform="translate(40.5 54) scale(.8)">${BRAC.replace(/<svg[^>]*>|<\/svg>/g, "")}</g></svg>`;
}
function grafRadar(eixos) {
  const n = eixos.length, cx = 120, cy = 104, R = 74;
  const punt = (i, f) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; };
  const anells = [0.33, 0.66, 1].map(f => `<polygon points="${eixos.map((_, i) => punt(i, f).map(x => x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="rgba(197,123,55,.25)"/>`).join("");
  const val = eixos.map((e, i) => punt(i, Math.max(0.04, e.valor)).map(x => x.toFixed(1)).join(",")).join(" ");
  const et = eixos.map((e, i) => { const [x, y] = punt(i, 1.24); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f6e3b8" font-family="Noto Serif,Georgia,serif">${esc(e.grupo)}</text>`; }).join("");
  return `<svg viewBox="0 0 240 210" aria-label="Series por grupo muscular esta semana">${anells}
    ${eixos.map((_, i) => { const [x, y] = punt(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(197,123,55,.2)"/>`; }).join("")}
    <polygon points="${val}" fill="rgba(253,80,10,.32)" stroke="#ffa030" stroke-width="2" filter="url(#brill)"/>${et}</svg>`;
}
function grafConstancia(dies) {
  const cel = 13, gap = 3, setm = Math.ceil(dies.length / 7);
  let s = "";
  dies.forEach((d, i) => {
    const col = Math.floor(i / 7), fila = i % 7;
    s += `<rect x="${col * (cel + gap)}" y="${fila * (cel + gap)}" width="${cel}" height="${cel}" fill="${d.entreno ? "url(#gFoc)" : "#1c1917"}" stroke="${d.entreno ? "#ffa030" : "rgba(197,123,55,.2)"}" stroke-width=".7"/>`;
  });
  return `<svg viewBox="0 0 ${setm * (cel + gap)} ${7 * (cel + gap)}" aria-label="Días entrenados, últimas 12 semanas">${s}</svg>`;
}
// La força: per a cada una de les últimes 8 setmanes, la mitjana del millor 1RM de cada exercici
// dividit pel primer que en tenim. 1 = com vas començar; 1,08 = un 8 % més fort.
function serieFuerza() {
  const fetes = S.ses.filter(s => s.fin).sort((a, b) => a.inicio - b.inicio);
  const primer = {}, setm = Array.from({ length: 8 }, () => ({}));
  const ara = Date.now();
  fetes.forEach(s => s.ej.forEach(e => e.sets.forEach(z => {
    if (!z.ok || !z.reps || e.x === "lastre" || !z.kg) return;
    const v = Stats.e1rm(z.kg, z.reps);
    if (!primer[e.n]) primer[e.n] = v;
    const fa = Math.floor((ara - s.fin) / (7 * 864e5));
    if (fa < 8) setm[7 - fa][e.n] = Math.max(setm[7 - fa][e.n] || 0, v);
  })));
  const out = setm.map(m => { const k = Object.keys(m); return k.length ? k.reduce((a, n) => a + m[n] / primer[n], 0) / k.length : null; });
  return out.filter(x => x != null).length >= 2 ? out : null;
}

    <div class="oro-guanyat" style="animation-delay:${tOr}ms">${MONEDA}<b class="or num" data-compta="${o.oro}" data-quan="${tOr}" data-signe="+">+0</b> de oro</div>
    <div class="fila-ratxa" style="animation-delay:${tR}ms;--t:${tR}ms">${o.salvada ? `<span class="ratxa-gel">${flama(true)}<i class="gel-bloc"></i><i class="gel-tros t1"></i><i class="gel-tros t2"></i><i class="gel-tros t3"></i><i class="gel-tros t4"></i></span>` : flama(true)}<div style="font-weight:700;font-size:21px">${o.rDes} ${o.rDes === 1 ? "día" : "días"} de racha</div></div>
    ${o.salvada ? `<div class="sub gel-text" style="animation-delay:${tR + 1000}ms">Tu día de descanso no apagó el fuego: racha salvada</div>` : ""}`,
    o.des.nivel > o.abans.nivel ? "¡SUBES DE NIVEL!" : "SEGUIR");
  document.querySelectorAll("#celebra [data-compta]").forEach(el => {
    const fins = +el.dataset.compta, quan = +el.dataset.quan, signe = el.dataset.signe || "";
    setTimeout(() => { if (signe) Efectos.suena("or"); else Efectos.suena("tic"); Efectos.vibra(10); comptaNum(el, fins, signe); }, quan);
  });
  setTimeout(() => { compta($("#xp-guanyat"), o.des.xp - o.abans.xp); const bi = $("#barra-nivell"); if (bi) bi.style.width = (o.des.nivel > o.abans.nivel ? 100 : o.des.enNivel / o.des.paraSubir * 100).toFixed(1) + "%"; }, tXp);

  else if (o.puja) setTimeout(() => Efectos.suena("ratxa"), tR + 100);
}
function comptaNum(el, fins, signe = "", ms = 700) {

  const t0 = performance.now();
  const pas = t => { const f = Math.min(1, (t - t0) / ms); el.textContent = signe + n0(fins * (1 - Math.pow(1 - f, 3))); if (f < 1) requestAnimationFrame(pas); };
  requestAnimationFrame(pas);
}

  for (const [os, signe, max, gest] of m.bracos) {
    const u = os.userData;
    if (!u.neta) { u.neta = new THREE.Quaternion(); u.feta = new THREE.Quaternion(); u.te = false; }
    // si el mixer no ha escrit l'os aquest fotograma, encara hi ha el gir d'abans: la neta és la guardada
    if (!u.te || !os.quaternion.equals(u.feta)) u.neta.copy(os.quaternion);
    os.quaternion.copy(u.neta);
    const angle = signe * (gest ? gest + (max - gest) * pes : max * pes);
    if (angle) {
      os.parent.getWorldQuaternion(_qp);
      _qm.setFromAxisAngle(_eix, angle);
      // gir al món → gir local: q = pare⁻¹ · gir · pare
      _q.copy(_qp).invert().multiply(_qm).multiply(_qp);
      os.quaternion.premultiply(_q);
    }
    u.feta.copy(os.quaternion); u.te = true;
  }
}
const pesRepos = m => (m.repos && m.repos.isRunning() ? m.repos.getEffectiveWeight() : m.ara === m.repos ? 1 : 0);

function pas(dt) {
  actiu.mixer.update(dt);
  if (actiu.pendent) { actiu.pendent = false; torna(); }
  // l'obertura dels braços segueix el pes del repòs suavitzat: en tornar d'un gest, el three.js dona al
  // repòs el pes sencer un fotograma abans que comenci el fos, i els braços s'obrien de cop aquell fotograma
  const objectiu = pesRepos(actiu);
  actiu.pes = actiu.pes == null ? objectiu : actiu.pes + (objectiu - actiu.pes) * Math.min(1, dt * 7);
  postura(actiu, actiu.pes);
  musculs(actiu);
}
function tic() {
  const dt = Math.min(0.05, rellotge.getDelta());
  if (actiu) pas(dt);
  rend.render(escena, cam);
}
function engega() { if (corrent) return; corrent = true; rellotge.getDelta(); rend.setAnimationLoop(tic); }
function atura() { if (!rend || !corrent) return; corrent = false; rend.setAnimationLoop(null); }

async function posa(heroi) {
  if (obs && caixa) obs.unobserve(caixa);
  caixa = heroi && heroi.isConnected ? heroi : null;
  if (!caixa) { atura(); return; }
  const tipo = caixa.dataset.tipo;
  if (!MODELS[tipo] || !prepara()) { atura(); return; }
  if (!actiu || actiu.tipo !== tipo) {
    const gltf = await carrega(tipo);
    if (!gltf || caixa !== heroi || !heroi.isConnected) return;   // no ha arribat, o ja som en una altra pantalla
    if (actiu) escena.remove(actiu.arrel);
    actiu = munta(gltf, tipo);
  }
  heroi.appendChild(rend.domElement);
  obs.observe(heroi);
  enquadra();
  rend.render(escena, cam);
  heroi.classList.add("amb3d");   // la il·lustració s'amaga només quan el 3D ja té un fotograma pintat
  engega();
}

// L'app demana un gest. Torna true si l'ha fet en 3D; si no, l'app fa saltar la il·lustració.
function reacciona(gest) {
  if (!actiu || !caixa || !caixa.isConnected || !caixa.classList.contains("amb3d")) return false;
  const nom = (GESTOS[gest] || [gest]).find(n => actiu.accions[n]);
  if (!nom) return false;
  const nova = actiu.accions[nom];
  if (nova === actiu.ara) { nova.reset().play(); return true; }
  nova.reset().setLoop(THREE.LoopOnce, 1);
  nova.clampWhenFinished = true;
  nova.setEffectiveWeight(1).fadeIn(0.25).play();
  if (actiu.ara) actiu.ara.fadeOut(0.25);
  actiu.ara = nova;
  return true;
}

// Una foto del que es veu ara, amb fons transparent: és la que fa servir l'app mentre el model arriba.
function foto() {
  if (!rend || !actiu) return null;
  rend.render(escena, cam);
  return rend.domElement.toDataURL("image/png");
}

// Per a les proves: pinta el clip `nom` a la fracció `frac` de la seva durada, amb o sense l'arranjament
// dels braços, i en torna la foto. Deixa el nan quiet en aquell fotograma (després cal recarregar).
function prova(nom, frac, ambPostura = true) {
  if (!actiu || !actiu.accions[nom]) return null;
  atura();
  const a = actiu.accions[nom];
  actiu.mixer.stopAllAction();
  a.reset().setLoop(THREE.LoopRepeat, Infinity).setEffectiveWeight(1).play();
  actiu.mixer.update(0);
  a.time = frac * a.getClip().duration;
  actiu.mixer.update(0);
  if (ambPostura) postura(actiu, nom === "repos" ? 1 : 0);
  musculs(actiu);
  rend.render(escena, cam);
  return rend.domElement.toDataURL("image/png");
}

// Per a les proves: fa córrer el nan fotograma a fotograma (60 per segon) durant `seg` segons, com ho fa
// tic(), i apunta on són les mans a cada fotograma. Un salt (la «sotragada») és un fotograma on una mà es
// mou molt més que als del voltant. `gests` = [[segon, gest], ...] per provar també els canvis de clip.
function diag(seg = 16, gests = [], bucle = null) {
  if (!actiu) return null;
  atura();
  if (bucle && actiu.repos) actiu.repos.setLoop(THREE[bucle], Infinity);
  const mans = [];
  actiu.arrel.traverse(o => { if (o.isBone && /(Left|Right)Hand$/.test(o.name)) mans.push(o); });
  const v = new THREE.Vector3(), abans = mans.map(() => new THREE.Vector3()), out = [];
  const dt = 1 / 60;
  for (let i = 0; i < seg * 60; i++) {
    for (const [t, g] of gests) if (Math.abs(i * dt - t) < dt / 2) reacciona(g);
    pas(dt);
    let max = 0;
    mans.forEach((m, k) => { m.getWorldPosition(v); if (i) max = Math.max(max, v.distanceTo(abans[k])); abans[k].copy(v); });
    out.push([+(i * dt).toFixed(3), +(max / ALT * 1000).toFixed(2), actiu.repos ? +actiu.repos.time.toFixed(3) : 0]);
  }
  engega();
  return out;
}

window.Escena3D = { reacciona, foto, prova, diag, fuerza, clip: nom => (actiu && actiu.accions[nom] ? actiu.accions[nom].getClip() : null) };
document.addEventListener("fragua:heroe", ev => { posa(ev.detail); });
posa(window.FRAGUA_HEROE || null);

</script>
</body></html>
